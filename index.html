/**
 * ════════════════════════════════════════════════════════════════════════════
 * EXECUTABLE GIF PHYSICS ENGINE
 * 
 * Mathematical Architecture:
 * 
 *   1. STATE SPACE (what can exist)
 *      Φ: Ω → ℝ         Scalar field on domain Ω ⊂ ℝ²
 *      F: Ω → ℝ²        Vector field on domain Ω
 *      G: Primitives    Geometric objects (circles, lines, text)
 * 
 *   2. DYNAMICS (how state evolves)
 *      ∂Φ/∂t = L[Φ]     Where L is a differential operator
 *      
 *      Supported operators:
 *        advect(c):     ∂Φ/∂t = -c · ∇Φ           (wave propagation)
 *        diffuse(D):    ∂Φ/∂t = D · ∇²Φ           (heat equation)
 *        wave(c):       ∂²Φ/∂t² = c² · ∇²Φ        (wave equation)
 *        rotate(ω):     θ(t) = θ₀ + ω·t           (rigid rotation)
 *        expand(v):     r(t) = r₀ + v·t           (radial expansion)
 *        oscillate(ω):  A(t) = A₀·sin(ω·t + φ)    (harmonic oscillation)
 *        pulse(ω):      Φ(t) = Φ₀·(1 + a·sin(ωt)) (amplitude modulation)
 * 
 *   3. OBSERVATION (how we render state)
 *      Φ(x,y) → color via colormap
 *      Primitives → canvas draw calls
 * 
 *   4. TIME STEPPING
 *      Φ(t + Δt) ≈ Φ(t) + Δt · ∂Φ/∂t   (Euler method)
 *      Each step = one GIF frame
 * 
 * ════════════════════════════════════════════════════════════════════════════
 */

// ════════════════════════════════════════════════════════════════════════════
// SECTION 1: MATHEMATICAL CONSTANTS & UTILITIES
// ════════════════════════════════════════════════════════════════════════════

const π = Math.PI;
const τ = 2 * Math.PI;  // Full circle
const e = Math.E;

/**
 * Clamp value to range [min, max]
 * Mathematical: projection onto closed interval
 */
function clamp(x, min, max) {
  return Math.max(min, Math.min(max, x));
}

/**
 * Linear interpolation
 * Mathematical: t ∈ [0,1] → a + t(b-a) ∈ [a,b]
 */
function lerp(a, b, t) {
  return a + t * (b - a);
}

/**
 * Map value from [a,b] to [c,d]
 * Mathematical: affine transformation
 */
function map(x, a, b, c, d) {
  return c + (x - a) * (d - c) / (b - a);
}


// ════════════════════════════════════════════════════════════════════════════
// SECTION 2: COLORMAPS
// Mathematical: f: [0,1] → RGB color space
// Each colormap is a path through color space parameterized by t ∈ [0,1]
// ════════════════════════════════════════════════════════════════════════════

const COLORMAPS = {
  /**
   * Plasma: Blue → Purple → Orange → Yellow
   * Perceptually uniform, good for field visualization
   */
  plasma: (t) => {
    // Attempt at perceptually uniform
    const r = clamp(Math.floor(255 * (0.05 + 0.95 * Math.pow(t, 0.5))), 0, 255);
    const g = clamp(Math.floor(255 * (0.02 + 0.4 * t + 0.4 * Math.pow(t, 3))), 0, 255);
    const b = clamp(Math.floor(255 * (0.5 - 0.3 * t + 0.3 * Math.pow(t, 2))), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Viridis: Purple → Blue → Green → Yellow
   * Standard scientific colormap
   */
  viridis: (t) => {
    const r = clamp(Math.floor(255 * (0.27 + 0.73 * Math.pow(t, 1.5))), 0, 255);
    const g = clamp(Math.floor(255 * (0.004 + 0.87 * t - 0.1 * t * t)), 0, 255);
    const b = clamp(Math.floor(255 * (0.33 + 0.35 * t - 0.65 * t * t)), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Thermal: Black → Red → Yellow → White
   * Good for intensity/temperature fields
   */
  thermal: (t) => {
    const r = clamp(Math.floor(255 * Math.min(1, 2 * t)), 0, 255);
    const g = clamp(Math.floor(255 * Math.max(0, 2 * t - 0.5)), 0, 255);
    const b = clamp(Math.floor(255 * Math.max(0, 4 * t - 3)), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Ocean: Deep blue → Cyan → White
   * Good for wave fields
   */
  ocean: (t) => {
    const r = clamp(Math.floor(255 * (0.05 + 0.95 * Math.pow(t, 2))), 0, 255);
    const g = clamp(Math.floor(255 * (0.1 + 0.6 * t + 0.3 * t * t)), 0, 255);
    const b = clamp(Math.floor(255 * (0.3 + 0.7 * Math.pow(t, 0.5))), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Diverging: Blue → White → Red
   * Good for fields with positive and negative values
   */
  diverging: (t) => {
    // t < 0.5: blue to white, t > 0.5: white to red
    if (t < 0.5) {
      const s = 2 * t;
      return [
        clamp(Math.floor(255 * s), 0, 255),
        clamp(Math.floor(255 * s), 0, 255),
        clamp(Math.floor(255 * (0.5 + 0.5 * s)), 0, 255)
      ];
    } else {
      const s = 2 * (t - 0.5);
      return [
        clamp(Math.floor(255 * (0.5 + 0.5 * s)), 0, 255),
        clamp(Math.floor(255 * (1 - s)), 0, 255),
        clamp(Math.floor(255 * (1 - s)), 0, 255)
      ];
    }
  },
  
  /**
   * Neon: Dark background with bright signal
   * Good for emphasizing structure
   */
  neon: (t) => {
    const intensity = Math.pow(t, 0.7);
    return [
      clamp(Math.floor(255 * (0.02 + 0.1 * intensity + 0.88 * Math.pow(intensity, 3))), 0, 255),
      clamp(Math.floor(255 * (intensity)), 0, 255),
      clamp(Math.floor(255 * (0.05 + 0.5 * intensity)), 0, 255)
    ];
  },
  
  /**
   * Grayscale: Black → White
   * Simplest colormap
   */
  grayscale: (t) => {
    const v = clamp(Math.floor(255 * t), 0, 255);
    return [v, v, v];
  },
  
  /**
   * Phase: Cyclic colormap for periodic quantities
   * Returns to start color at t=1
   */
  phase: (t) => {
    const h = t * 360;
    // HSV to RGB conversion
    const c = 1;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [Math.floor(255 * r), Math.floor(255 * g), Math.floor(255 * b)];
  },
  
  /**
   * CLA: Collapse Logic Algebra colormap
   * Discrete colors for 7 logic states:
   *   0: VOID   (black)      - No shells
   *   1: PASS   (gray)       - Signal propagates  
   *   2: AND    (red)        - Conjunction
   *   3: OR     (blue)       - Disjunction
   *   4: NOT    (yellow)     - Negation context
   *   5: XOR    (magenta)    - Exclusive or
   *   6: LATCH  (white)      - Memory lock
   * 
   * ITT: Maps continuous field dynamics to discrete logic
   */
  cla: (t) => {
    // t is normalized [0,1], map to state [0,6]
    const state = Math.round(t * 6);
    const colors = [
      [0, 0, 0],         // 0: VOID - black
      [100, 100, 100],   // 1: PASS - gray
      [220, 50, 50],     // 2: AND - red
      [50, 100, 220],    // 3: OR - blue
      [230, 220, 50],    // 4: NOT - yellow
      [200, 50, 200],    // 5: XOR - magenta
      [255, 255, 255]    // 6: LATCH - white
    ];
    return colors[Math.min(state, 6)];
  },
  
  /**
   * Shells: Emphasize shell boundaries (high gradient regions)
   * Dark background with bright shells
   * Good for visualizing ρq directly
   */
  shells: (t) => {
    // Exponential emphasis on high values
    const s = Math.pow(t, 0.3);
    return [
      clamp(Math.floor(255 * s * 0.9), 0, 255),
      clamp(Math.floor(255 * s * 0.6), 0, 255),
      clamp(Math.floor(255 * s * 1.0), 0, 255)
    ];
  }
};


// ════════════════════════════════════════════════════════════════════════════
// SECTION 3: FIELD CLASS
// Mathematical: Φ: Ω → ℝ where Ω = [0, W] × [0, H] ⊂ ℝ²
// Discretized to NX × NY grid
// ════════════════════════════════════════════════════════════════════════════

class ScalarField {
  /**
   * Create a scalar field on a discrete grid
   * @param {number} nx - Number of grid points in x
   * @param {number} ny - Number of grid points in y
   * @param {number} width - Physical width of domain
   * @param {number} height - Physical height of domain
   */
  constructor(nx, ny, width = 1, height = 1) {
    this.nx = nx;
    this.ny = ny;
    this.width = width;
    this.height = height;
    this.dx = width / nx;   // Grid spacing in x
    this.dy = height / ny;  // Grid spacing in y
    
    // Φ values stored in row-major order
    // Φ[i + j * nx] = Φ(x_i, y_j)
    this.data = new Float32Array(nx * ny);
    
    // For wave equation, we need velocity field
    this.velocity = null;
  }
  
  /**
   * Get field value at grid point (i, j)
   * Mathematical: Φ(x_i, y_j)
   */
  get(i, j) {
    // Periodic boundary conditions
    i = ((i % this.nx) + this.nx) % this.nx;
    j = ((j % this.ny) + this.ny) % this.ny;
    return this.data[i + j * this.nx];
  }
  
  /**
   * Set field value at grid point (i, j)
   */
  set(i, j, value) {
    i = ((i % this.nx) + this.nx) % this.nx;
    j = ((j % this.ny) + this.ny) % this.ny;
    this.data[i + j * this.nx] = value;
  }
  
  /**
   * Get value at continuous coordinates using bilinear interpolation
   * Mathematical: Φ(x, y) for arbitrary (x, y) ∈ Ω
   */
  sample(x, y) {
    // Convert to grid coordinates
    const gx = x / this.dx;
    const gy = y / this.dy;
    
    // Grid cell indices
    const i0 = Math.floor(gx);
    const j0 = Math.floor(gy);
    
    // Fractional part
    const fx = gx - i0;
    const fy = gy - j0;
    
    // Bilinear interpolation
    const v00 = this.get(i0, j0);
    const v10 = this.get(i0 + 1, j0);
    const v01 = this.get(i0, j0 + 1);
    const v11 = this.get(i0 + 1, j0 + 1);
    
    return (1 - fx) * (1 - fy) * v00 +
           fx * (1 - fy) * v10 +
           (1 - fx) * fy * v01 +
           fx * fy * v11;
  }
  
  /**
   * Compute gradient ∇Φ at grid point using central differences
   * Mathematical: ∇Φ = (∂Φ/∂x, ∂Φ/∂y)
   */
  gradient(i, j) {
    const dPhidx = (this.get(i + 1, j) - this.get(i - 1, j)) / (2 * this.dx);
    const dPhidy = (this.get(i, j + 1) - this.get(i, j - 1)) / (2 * this.dy);
    return [dPhidx, dPhidy];
  }
  
  /**
   * Compute Laplacian ∇²Φ at grid point using central differences
   * Mathematical: ∇²Φ = ∂²Φ/∂x² + ∂²Φ/∂y²
   */
  laplacian(i, j) {
    const d2Phidx2 = (this.get(i + 1, j) - 2 * this.get(i, j) + this.get(i - 1, j)) / (this.dx * this.dx);
    const d2Phidy2 = (this.get(i, j + 1) - 2 * this.get(i, j) + this.get(i, j - 1)) / (this.dy * this.dy);
    return d2Phidx2 + d2Phidy2;
  }
  
  /**
   * Compute |∇Φ|² - gradient magnitude squared
   * Mathematical: |∇Φ|² = (∂Φ/∂x)² + (∂Φ/∂y)²
   * 
   * This is the ITT tension intensity - measures collapse pressure
   * In CSS: appears as steepening term -λ|∇Φ|²
   */
  gradientMagnitudeSq(i, j) {
    const [dPhidx, dPhidy] = this.gradient(i, j);
    return dPhidx * dPhidx + dPhidy * dPhidy;
  }
  
  /**
   * Compute |∇Φ| - gradient magnitude (tension)
   * Mathematical: |∇Φ| = √((∂Φ/∂x)² + (∂Φ/∂y)²)
   * 
   * ITT: This is the Δ₁ fan - tension alignment gate
   * High |∇Φ| = strong collapse direction
   */
  gradientMagnitude(i, j) {
    return Math.sqrt(this.gradientMagnitudeSq(i, j));
  }
  
  /**
   * Compute curl magnitude |∇×F| where F = ∇Φ (scalar field gives 2D curl)
   * Mathematical: For 2D, this measures rotation in the gradient field
   * 
   * ITT: This is the Δ₂ fan - phase memory / recursive curl
   * Non-zero curl indicates memory loop closure
   */
  curlMagnitude(i, j) {
    // For scalar field Φ, compute ∂²Φ/∂x∂y asymmetry as proxy for rotation
    // True curl requires vector field, but we approximate via mixed partials
    const dxdy1 = (this.get(i+1, j+1) - this.get(i+1, j-1) - this.get(i-1, j+1) + this.get(i-1, j-1)) / (4 * this.dx * this.dy);
    const dydx1 = dxdy1; // For smooth fields, mixed partials are equal
    // The asymmetry in finite differences can indicate rotation
    const d2x = (this.get(i+1, j) - 2*this.get(i, j) + this.get(i-1, j)) / (this.dx * this.dx);
    const d2y = (this.get(i, j+1) - 2*this.get(i, j) + this.get(i, j-1)) / (this.dy * this.dy);
    // Use difference of second derivatives as rotation proxy
    return Math.abs(d2x - d2y);
  }
  
  /**
   * Get min and max values in field
   * Used for colormap normalization
   */
  range() {
    let min = Infinity;
    let max = -Infinity;
    for (let k = 0; k < this.data.length; k++) {
      if (this.data[k] < min) min = this.data[k];
      if (this.data[k] > max) max = this.data[k];
    }
    return [min, max];
  }
  
  // ════════════════════════════════════════════════════════════════════════════
  // PHASE 4: CLA^ (Collapse Logic Algebra)
  // Detect shell configurations as discrete logic states
  // Shell = high |∇Φ| region (ρq)
  // Logic gates emerge from spatial shell configurations
  // ════════════════════════════════════════════════════════════════════════════
  
  /**
   * Compute ρq (shell detection) at a point
   * ρq = 1 where |∇Φ| > threshold, 0 otherwise
   * 
   * ITT: Shells are termination surfaces where recursive collapse stabilizes
   * The threshold is derived from field statistics (μ + k·σ)
   */
  rhoQ(i, j, threshold = null) {
    const gradMag = this.gradientMagnitude(i, j);
    if (threshold === null) {
      // Default threshold: adaptive based on local context
      threshold = 0.3;  // Can be overridden
    }
    return gradMag > threshold ? 1 : 0;
  }
  
  /**
   * Compute shell mask for entire field
   * Returns Float32Array with 1 at shells, 0 elsewhere
   * 
   * Uses physics-derived threshold: μ + k·σ of gradient magnitudes
   */
  shellMask(kSigma = 1.0) {
    const mask = new Float32Array(this.nx * this.ny);
    const gradients = new Float32Array(this.nx * this.ny);
    
    // First pass: compute all gradient magnitudes
    let sum = 0, sumSq = 0, count = 0;
    for (let j = 0; j < this.ny; j++) {
      for (let i = 0; i < this.nx; i++) {
        const k = i + j * this.nx;
        const g = this.gradientMagnitude(i, j);
        gradients[k] = g;
        if (g > 0) {
          sum += g;
          sumSq += g * g;
          count++;
        }
      }
    }
    
    // Compute threshold from statistics
    const mu = count > 0 ? sum / count : 0;
    const variance = count > 0 ? (sumSq / count) - mu * mu : 0;
    const sigma = Math.sqrt(Math.max(0, variance));
    const threshold = mu + kSigma * sigma;
    
    // Second pass: apply threshold
    for (let k = 0; k < gradients.length; k++) {
      mask[k] = gradients[k] >= threshold ? 1 : 0;
    }
    
    return { mask, threshold, mu, sigma };
  }
  
  /**
   * CLA^ State Classification
   * Analyzes 3x3 neighborhood of shells to determine logic gate type
   * 
   * States:
   *   0: VOID   - No shells in neighborhood (ground state)
   *   1: PASS   - Single shell direction (signal propagates)
   *   2: AND    - Converging shells (conjunction)
   *   3: OR     - Diverging shells (disjunction)  
   *   4: NOT    - Enclosed by shells (negation context)
   *   5: XOR    - Perpendicular crossing (exclusive or)
   *   6: LATCH  - Dense shell region (memory lock)
   * 
   * ITT Mapping:
   *   - VOID = Φ_q = 0 (ground domain)
   *   - PASS = single ρq boundary
   *   - AND/OR = shell junctions (decision points)
   *   - NOT = enclosed region (inverted context)
   *   - XOR = perpendicular shell crossing
   *   - LATCH = shell lock (recursive memory)
   */
  claState(i, j, shellMask) {
    // Count shells in 3x3 neighborhood
    let shellCount = 0;
    let shellPositions = [];
    
    for (let dj = -1; dj <= 1; dj++) {
      for (let di = -1; di <= 1; di++) {
        const ni = (i + di + this.nx) % this.nx;
        const nj = (j + dj + this.ny) % this.ny;
        const k = ni + nj * this.nx;
        if (shellMask[k] > 0) {
          shellCount++;
          shellPositions.push([di, dj]);
        }
      }
    }
    
    // Classify based on shell configuration
    const centerK = i + j * this.nx;
    const isShell = shellMask[centerK] > 0;
    
    // VOID: No shells nearby
    if (shellCount === 0) {
      return 0;  // VOID
    }
    
    // LATCH: Dense shell region (>=7 of 9 are shells)
    if (shellCount >= 7) {
      return 6;  // LATCH
    }
    
    // For remaining cases, analyze shell geometry
    // Compute shell "direction" from positions
    let sumX = 0, sumY = 0;
    for (const [dx, dy] of shellPositions) {
      sumX += dx;
      sumY += dy;
    }
    
    // Check for enclosure (shells on opposite sides)
    let hasLeft = false, hasRight = false, hasUp = false, hasDown = false;
    for (const [dx, dy] of shellPositions) {
      if (dx < 0) hasLeft = true;
      if (dx > 0) hasRight = true;
      if (dy < 0) hasUp = true;
      if (dy > 0) hasDown = true;
    }
    
    const enclosedH = hasLeft && hasRight;
    const enclosedV = hasUp && hasDown;
    
    // NOT: Enclosed on both axes (inside a shell boundary)
    if (enclosedH && enclosedV && !isShell) {
      return 4;  // NOT
    }
    
    // XOR: Perpendicular crossing (shells in perpendicular directions)
    if ((hasLeft || hasRight) && (hasUp || hasDown) && isShell) {
      // Check if it's a cross pattern
      const horizontal = (hasLeft ? 1 : 0) + (hasRight ? 1 : 0);
      const vertical = (hasUp ? 1 : 0) + (hasDown ? 1 : 0);
      if (horizontal >= 1 && vertical >= 1 && shellCount >= 4) {
        return 5;  // XOR
      }
    }
    
    // Analyze gradient direction for convergence/divergence
    if (isShell) {
      const [gx, gy] = this.gradient(i, j);
      const gradAngle = Math.atan2(gy, gx);
      
      // Check neighbor gradients for convergence
      let converging = 0, diverging = 0;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          if (di === 0 && dj === 0) continue;
          const ni = (i + di + this.nx) % this.nx;
          const nj = (j + dj + this.ny) % this.ny;
          const nk = ni + nj * this.nx;
          if (shellMask[nk] > 0) {
            const [ngx, ngy] = this.gradient(ni, nj);
            const nAngle = Math.atan2(ngy, ngx);
            // Vector pointing from neighbor to center
            const toCenter = Math.atan2(-dj, -di);
            // If gradient points toward center, converging
            const diff = Math.abs(nAngle - toCenter);
            if (diff < π/3 || diff > 5*π/3) {
              converging++;
            } else if (diff > 2*π/3 && diff < 4*π/3) {
              diverging++;
            }
          }
        }
      }
      
      // AND: Multiple shells converging
      if (converging >= 2 && shellCount >= 3) {
        return 2;  // AND
      }
      
      // OR: Shells diverging
      if (diverging >= 2 && shellCount >= 3) {
        return 3;  // OR
      }
    }
    
    // PASS: Default for shell regions (signal propagates)
    if (isShell || shellCount >= 1) {
      return 1;  // PASS
    }
    
    return 0;  // VOID (fallback)
  }
  
  /**
   * Compute full CLA^ field
   * Returns array of logic states [0-6] for each cell
   */
  claField(kSigma = 1.0) {
    const { mask, threshold } = this.shellMask(kSigma);
    const cla = new Float32Array(this.nx * this.ny);
    
    for (let j = 0; j < this.ny; j++) {
      for (let i = 0; i < this.nx; i++) {
        cla[i + j * this.nx] = this.claState(i, j, mask);
      }
    }
    
    return { cla, shellMask: mask, threshold };
  }
  
  /**
   * Count CLA states in field
   * Returns object with counts for each state type
   */
  claStats(kSigma = 1.0) {
    const { cla } = this.claField(kSigma);
    const stats = {
      VOID: 0,   // 0
      PASS: 0,   // 1
      AND: 0,    // 2
      OR: 0,     // 3
      NOT: 0,    // 4
      XOR: 0,    // 5
      LATCH: 0   // 6
    };
    const names = ['VOID', 'PASS', 'AND', 'OR', 'NOT', 'XOR', 'LATCH'];
    
    for (let k = 0; k < cla.length; k++) {
      const state = Math.round(cla[k]);
      if (state >= 0 && state <= 6) {
        stats[names[state]]++;
      }
    }
    
    return stats;
  }
  
  /**
   * Create a deep copy of this field
   */
  clone() {
    const copy = new ScalarField(this.nx, this.ny, this.width, this.height);
    copy.data.set(this.data);
    if (this.velocity) {
      copy.velocity = new Float32Array(this.velocity);
    }
    return copy;
  }
  
  // ════════════════════════════════════════════════════════════════════════════
  // PHASE 7: AGI MACHINERY
  // Loss functions, optimization, and learning
  // These are the REAL mechanics that close the AGI gap
  // ════════════════════════════════════════════════════════════════════════════
  
  /**
   * σ-LOSS: Difference field magnitude
   * σ = ||Φ - Φ*||₁ = Σ|Φᵢ - Φ*ᵢ|
   * 
   * This is the RECONSTRUCTION LOSS from ITT v5B.
   * Measures how far current field is from target.
   * 
   * @param {ScalarField} target - The target field Φ*
   * @returns {number} - L1 norm of difference
   */
  sigmaLoss(target) {
    if (target.data.length !== this.data.length) {
      throw new Error('Field dimensions must match for σ-loss');
    }
    let sum = 0;
    for (let k = 0; k < this.data.length; k++) {
      sum += Math.abs(this.data[k] - target.data[k]);
    }
    return sum;
  }
  
  /**
   * σ-FIELD: Pointwise difference field
   * σ(x,y) = |Φ(x,y) - Φ*(x,y)|
   * 
   * Returns the spatial distribution of error.
   * 
   * @param {ScalarField} target - The target field Φ*
   * @returns {Float32Array} - Difference at each point
   */
  sigmaField(target) {
    const sigma = new Float32Array(this.data.length);
    for (let k = 0; k < this.data.length; k++) {
      sigma[k] = Math.abs(this.data[k] - target.data[k]);
    }
    return sigma;
  }
  
  /**
   * DIRICHLET ENERGY: Smoothness measure
   * E = ∫|∇Φ|² dx dy = Σ|∇Φᵢ|²
   * 
   * This is the ENERGY REGULARIZER from ITT v5B.
   * Prefers smooth fields over jagged ones.
   * Low energy = smooth field, high energy = lots of edges.
   * 
   * @returns {number} - Total Dirichlet energy
   */
  dirichletEnergy() {
    let energy = 0;
    for (let j = 0; j < this.ny; j++) {
      for (let i = 0; i < this.nx; i++) {
        energy += this.gradientMagnitudeSq(i, j);
      }
    }
    return energy * this.dx * this.dy;  // Scale by cell area
  }
  
  /**
   * TOTAL LOSS: Combined objective
   * L = ||σ||₁ + λE
   * 
   * This is the OPTIMIZATION OBJECTIVE from ITT v5B.
   * Balances reconstruction accuracy with smoothness.
   * 
   * @param {ScalarField} target - The target field Φ*
   * @param {number} lambda - Energy regularization weight (default 0.01)
   * @returns {object} - {total, sigma, energy} loss components
   */
  totalLoss(target, lambda = 0.01) {
    const sigma = this.sigmaLoss(target);
    const energy = this.dirichletEnergy();
    return {
      total: sigma + lambda * energy,
      sigma: sigma,
      energy: energy,
      lambda: lambda
    };
  }
  
  /**
   * CURIOSITY: Predictive entropy measure
   * H(Φₜ₊₁|Φₜ) ≈ Variance of field changes
   * 
   * High curiosity = field is changing unpredictably (interesting)
   * Low curiosity = field is static or predictable (boring)
   * 
   * @param {ScalarField} previous - The previous field state
   * @returns {number} - Curiosity/interest measure
   */
  curiosity(previous) {
    if (!previous || previous.data.length !== this.data.length) {
      return 0;
    }
    
    // Compute change field
    let sum = 0, sumSq = 0;
    for (let k = 0; k < this.data.length; k++) {
      const delta = this.data[k] - previous.data[k];
      sum += delta;
      sumSq += delta * delta;
    }
    
    const n = this.data.length;
    const mean = sum / n;
    const variance = (sumSq / n) - mean * mean;
    
    // Return entropy proxy (variance of changes)
    return Math.sqrt(Math.max(0, variance));
  }
  
  /**
   * GATE PENALTY: Soft constraint violation
   * Converts hard Gate A/B/C constraints to differentiable penalties
   * 
   * From ITT v5C:
   *   Gate A: Boundary respect (no spurious shells)
   *   Gate B: σ localization (changes only in allowed support)
   *   Gate C: Quantization (values in valid range)
   * 
   * @param {ScalarField} input - Original input field
   * @param {ScalarField} target - Target output field
   * @returns {object} - {gateA, gateB, gateC, total} penalties
   */
  gatePenalty(input, target) {
    // Gate A: Boundary respect
    // Penalty for creating shells where input had none
    const { mask: inputShells } = input.shellMask(1.0);
    const { mask: ourShells } = this.shellMask(1.0);
    
    let spuriousShells = 0;
    for (let k = 0; k < ourShells.length; k++) {
      if (ourShells[k] > 0 && inputShells[k] === 0) {
        // Check if near an input shell (dilated)
        const i = k % this.nx;
        const j = Math.floor(k / this.nx);
        let nearShell = false;
        for (let dj = -1; dj <= 1 && !nearShell; dj++) {
          for (let di = -1; di <= 1 && !nearShell; di++) {
            const ni = (i + di + this.nx) % this.nx;
            const nj = (j + dj + this.ny) % this.ny;
            if (inputShells[ni + nj * this.nx] > 0) nearShell = true;
          }
        }
        if (!nearShell) spuriousShells++;
      }
    }
    const gateA = spuriousShells / Math.max(1, ourShells.reduce((a,b) => a+b, 0));
    
    // Gate B: σ localization
    // Penalty for changes outside allowed support
    const sigma = this.sigmaField(target);
    const support = input.allowedSupport();
    let outsideSupport = 0;
    for (let k = 0; k < sigma.length; k++) {
      if (sigma[k] > 0.01 && !support[k]) {
        outsideSupport += sigma[k];
      }
    }
    const gateB = outsideSupport;
    
    // Gate C: Quantization
    // Penalty for values outside [0, 1] range (for normalized fields)
    let outOfRange = 0;
    for (let k = 0; k < this.data.length; k++) {
      if (this.data[k] < -1.5) outOfRange += Math.abs(this.data[k] + 1.5);
      if (this.data[k] > 1.5) outOfRange += Math.abs(this.data[k] - 1.5);
    }
    const gateC = outOfRange;
    
    return {
      gateA: gateA,
      gateB: gateB,
      gateC: gateC,
      total: gateA + gateB + gateC
    };
  }
  
  /**
   * ALLOWED SUPPORT: Where changes are permitted
   * From ITT v5C: support = nonzero ∪ enclosed ∪ σ_irr
   * 
   * @returns {Uint8Array} - Boolean mask of allowed edit zones
   */
  allowedSupport() {
    const support = new Uint8Array(this.data.length);
    
    // Nonzero regions
    for (let k = 0; k < this.data.length; k++) {
      if (Math.abs(this.data[k]) > 0.01) {
        support[k] = 1;
      }
    }
    
    // Shell regions (σ_irr concept)
    const { mask: shells } = this.shellMask(1.0);
    for (let k = 0; k < shells.length; k++) {
      if (shells[k] > 0) support[k] = 1;
    }
    
    // Dilate support by 1 pixel
    const dilated = new Uint8Array(support);
    for (let j = 0; j < this.ny; j++) {
      for (let i = 0; i < this.nx; i++) {
        const k = i + j * this.nx;
        if (support[k]) continue;
        for (let dj = -1; dj <= 1; dj++) {
          for (let di = -1; di <= 1; di++) {
            const ni = (i + di + this.nx) % this.nx;
            const nj = (j + dj + this.ny) % this.ny;
            if (support[ni + nj * this.nx]) {
              dilated[k] = 1;
              break;
            }
          }
          if (dilated[k]) break;
        }
      }
    }
    
    return dilated;
  }
  
  /**
   * EMERGENCE OBJECTIVE: The 3.5D optimization target
   * J(θ) = H(Φₜ₊₁|Φₜ) - λK(θ)
   * 
   * Maximize interest while minimizing complexity.
   * This is what makes a GIF "interesting" vs "boring".
   * 
   * @param {ScalarField} previous - Previous field state
   * @param {number} complexity - Kolmogorov complexity proxy (e.g., parameter count)
   * @param {number} lambda - Complexity penalty weight
   * @returns {number} - Emergence score (higher = more interesting)
   */
  emergenceScore(previous, complexity = 1, lambda = 0.1) {
    const interest = this.curiosity(previous);
    return interest - lambda * complexity;
  }
}

/**
 * SymbolEmitter: Σ = g(ρq, CLA^, Ω^)
 * 
 * Monitors field state and emits discrete symbols when events occur.
 * Maintains history for pattern detection.
 */
class SymbolEmitter {
  constructor(config = {}) {
    // Emission thresholds
    this.shellThreshold = config.shellThreshold ?? 0.1;     // ρq spike threshold
    this.memoryThreshold = config.memoryThreshold ?? 0.5;   // Ω^ threshold
    this.gateThreshold = config.gateThreshold ?? 50;        // Gate count threshold
    this.latchFrames = config.latchFrames ?? 3;             // Frames to confirm LATCH
    this.saturationThreshold = config.saturationThreshold ?? 0.95;  // Near clamp
    
    // State tracking
    this.prevStats = null;         // Previous CLA stats
    this.prevShellCount = 0;       // Previous shell pixel count
    this.prevMemorySum = 0;        // Previous total memory
    this.prevFieldMean = 0;        // Previous field mean
    this.prevFieldRange = [0, 0];  // Previous [min, max]
    this.latchCounter = 0;         // Frames with stable LATCH
    this.frameCount = 0;           // Total frames processed
    
    // Symbol buffer
    this.buffer = [];              // Emitted symbols
    this.maxBuffer = config.maxBuffer ?? 1000;
    
    // Sequence tracking
    this.sequence = '';            // String of symbol chars
    this.timestamps = [];          // When each symbol was emitted

  /**
   * Process field state and emit symbols
   * Σ = g(ρq, CLA^, Ω^)
   * 
   * @param {ScalarField} field - Current field state
   * @param {number} t - Current time
   * @param {Object} evolveInfo - Info from evolution operator
   * @returns {Array} Newly emitted symbols
   */
  process(field, t, evolveInfo = {}) {
    const emitted = [];
    this.frameCount++;
    
    // ═══════════════════════════════════════════════════════════════════════
    // 1. Compute current state
    // ═══════════════════════════════════════════════════════════════════════
    
    // CLA stats
    const stats = field.claStats(1.0);
    
    // Shell count (ρq)
    const { mask: shellMask } = field.shellMask(1.0);
    let shellCount = 0;
    for (let k = 0; k < shellMask.length; k++) {
      if (shellMask[k] > 0) shellCount++;
    }
    
    // Memory sum (Ω^)
    let memorySum = 0;
    if (field.memory) {
      for (let k = 0; k < field.memory.length; k++) {
        memorySum += field.memory[k];
      }
    }
    
    // Field statistics
    const [min, max] = field.range();
    let fieldSum = 0;
    for (let k = 0; k < field.data.length; k++) {
      fieldSum += field.data[k];
    }
    const fieldMean = fieldSum / field.data.length;
    
    // ═══════════════════════════════════════════════════════════════════════
    // 2. Detect events and emit symbols
    // ═══════════════════════════════════════════════════════════════════════
    
    if (this.prevStats !== null) {
      const n = field.data.length;
      
      // ─────────────────────────────────────────────────────────────────────
      // SHELL (ρ): New shells forming
      // ─────────────────────────────────────────────────────────────────────
      const shellDelta = (shellCount - this.prevShellCount) / n;
      if (shellDelta > this.shellThreshold) {
        emitted.push(this.emit('SHELL', t, { delta: shellDelta }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // LATCH (λ): Stable memory lock
      // ─────────────────────────────────────────────────────────────────────
      if (stats.LATCH > this.gateThreshold) {
        this.latchCounter++;
        if (this.latchCounter === this.latchFrames) {
          emitted.push(this.emit('LATCH', t, { count: stats.LATCH }));
        }
      } else {
        this.latchCounter = 0;
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // AND (∧): Conjunction gate surge
      // ─────────────────────────────────────────────────────────────────────
      const andDelta = stats.AND - this.prevStats.AND;
      if (andDelta > this.gateThreshold) {
        emitted.push(this.emit('AND', t, { delta: andDelta, count: stats.AND }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // OR (∨): Disjunction gate surge
      // ─────────────────────────────────────────────────────────────────────
      const orDelta = stats.OR - this.prevStats.OR;
      if (orDelta > this.gateThreshold) {
        emitted.push(this.emit('OR', t, { delta: orDelta, count: stats.OR }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // NOT (¬): Negation context emergence
      // ─────────────────────────────────────────────────────────────────────
      const notDelta = stats.NOT - this.prevStats.NOT;
      if (notDelta > this.gateThreshold) {
        emitted.push(this.emit('NOT', t, { delta: notDelta, count: stats.NOT }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // XOR (⊕): Exclusive crossing emergence
      // ─────────────────────────────────────────────────────────────────────
      const xorDelta = stats.XOR - this.prevStats.XOR;
      if (xorDelta > this.gateThreshold) {
        emitted.push(this.emit('XOR', t, { delta: xorDelta, count: stats.XOR }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // MEMORY (Ω): Memory threshold crossing
      // ─────────────────────────────────────────────────────────────────────
      const avgMemory = memorySum / n;
      const prevAvgMemory = this.prevMemorySum / n;
      if (avgMemory > this.memoryThreshold && prevAvgMemory <= this.memoryThreshold) {
        emitted.push(this.emit('MEMORY', t, { value: avgMemory }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // COLLAPSE (↓): Field mean decreasing significantly
      // ─────────────────────────────────────────────────────────────────────
      const meanDelta = fieldMean - this.prevFieldMean;
      if (meanDelta < -0.1) {
        emitted.push(this.emit('COLLAPSE', t, { delta: meanDelta }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // EXPAND (↑): Field mean increasing significantly
      // ─────────────────────────────────────────────────────────────────────
      if (meanDelta > 0.1) {
        emitted.push(this.emit('EXPAND', t, { delta: meanDelta }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // VOID (∅): Ground state expanding
      // ─────────────────────────────────────────────────────────────────────
      const voidDelta = stats.VOID - this.prevStats.VOID;
      if (voidDelta > this.gateThreshold * 2) {
        emitted.push(this.emit('VOID', t, { delta: voidDelta }));
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // SATURATE (∞): Field hitting bounds
      // ─────────────────────────────────────────────────────────────────────
      const clamp = evolveInfo.clamp ?? 1.5;
      if (Math.abs(max) > clamp * this.saturationThreshold || 
          Math.abs(min) > clamp * this.saturationThreshold) {
        if (Math.abs(this.prevFieldRange[1]) <= clamp * this.saturationThreshold &&
            Math.abs(this.prevFieldRange[0]) <= clamp * this.saturationThreshold) {
          emitted.push(this.emit('SATURATE', t, { min, max }));
        }
      }
      
      // ─────────────────────────────────────────────────────────────────────
      // PULSE (•): Transient activation (range spike then return)
      // ─────────────────────────────────────────────────────────────────────
      const rangePrev = this.prevFieldRange[1] - this.prevFieldRange[0];
      const rangeCurr = max - min;
      if (rangeCurr > rangePrev * 1.5 && rangePrev > 0.1) {
        emitted.push(this.emit('PULSE', t, { range: rangeCurr }));
      }
    }
    
    // ═══════════════════════════════════════════════════════════════════════
    // 3. Update state for next frame
    // ═══════════════════════════════════════════════════════════════════════
    
    this.prevStats = stats;
    this.prevShellCount = shellCount;
    this.prevMemorySum = memorySum;
    this.prevFieldMean = fieldMean;
    this.prevFieldRange = [min, max];
    
    return emitted;
  }
  
  /**
   * Emit a symbol
   */
  emit(type, t, data = {}) {
    const vocab = SYMBOL_VOCAB[type];
    const symbol = {
      type,
      char: vocab.char,
      name: vocab.name,
      desc: vocab.desc,
      time: t,
      frame: this.frameCount,
      data
    };
    
    // Add to buffer (with overflow protection)
    this.buffer.push(symbol);
    if (this.buffer.length > this.maxBuffer) {
      this.buffer.shift();
    }
    
    // Update sequence string
    this.sequence += vocab.char;
    this.timestamps.push(t);
    
    return symbol;
  }
  
  /**
   * Get the symbol sequence as a string
   */
  getSequence() {
    return this.sequence;
  }
  
  /**
   * Get recent symbols
   */
  getRecent(n = 10) {
    return this.buffer.slice(-n);
  }
  
  /**
   * Get symbol frequency counts
   */
  getFrequencies() {
    const freq = {};
    for (const sym of this.buffer) {
      freq[sym.type] = (freq[sym.type] || 0) + 1;
    }
    return freq;
  }
  
  /**
   * Detect repeating patterns in sequence
   */
  detectPatterns(minLen = 2, maxLen = 8) {
    const patterns = {};
    const seq = this.sequence;
    
    for (let len = minLen; len <= maxLen; len++) {
      for (let i = 0; i <= seq.length - len; i++) {
        const pattern = seq.slice(i, i + len);
        patterns[pattern] = (patterns[pattern] || 0) + 1;
      }
    }
    
    // Filter to patterns that repeat
    const repeating = {};
    for (const [pattern, count] of Object.entries(patterns)) {
      if (count >= 2) {
        repeating[pattern] = count;
      }
    }
    
    return repeating;
  }
  
  /**
   * Format output for logging
   */
  format() {
    const lines = [];
    lines.push(`Σ Sequence: ${this.sequence || '(empty)'}`);
    lines.push(`Total symbols: ${this.buffer.length}`);
    
    const freq = this.getFrequencies();
    if (Object.keys(freq).length > 0) {
      lines.push(`Frequencies: ${Object.entries(freq).map(([k,v]) => `${SYMBOL_VOCAB[k].char}:${v}`).join(' ')}`);
    }
    
    const patterns = this.detectPatterns();
    const topPatterns = Object.entries(patterns)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);
    if (topPatterns.length > 0) {
      lines.push(`Patterns: ${topPatterns.map(([p,c]) => `"${p}"×${c}`).join(' ')}`);
    }
    
    return lines.join('\n');
  }
  
  /**
   * Reset emitter state
   */
  reset() {
    this.prevStats = null;
    this.prevShellCount = 0;
    this.prevMemorySum = 0;
    this.prevFieldMean = 0;
    this.prevFieldRange = [0, 0];
    this.latchCounter = 0;
    this.frameCount = 0;
    this.buffer = [];
    this.sequence = '';
    this.timestamps = [];
  }
}

// SECTION 4: INITIAL CONDITION GENERATORS
// Mathematical: Functions that create Φ₀(x, y)

const INITIAL_CONDITIONS = {
  /**
   * Plane wave: Φ₀(x, y) = A · sin(k·x + φ)
   * Parameters: A (amplitude), k (wave number), φ (phase)
   * 
   * Mathematical: k = 2π/λ where λ is wavelength
   * The wave propagates in the x-direction
   */
  wave: (field, params) => {
    const A = params.A ?? 1;
    const lambda = params.λ ?? params.lambda ?? 50;  // wavelength in pixels
    const k = τ / lambda;  // wave number
    const phi = params.φ ?? params.phi ?? 0;  // initial phase
    const angle = (params.θ ?? params.theta ?? 0) * π / 180;  // propagation angle
    
    const kx = k * Math.cos(angle);
    const ky = k * Math.sin(angle);
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        field.set(i, j, A * Math.sin(kx * x + ky * y + phi));
      }
    }
    
    return { type: 'wave', A, λ: lambda, k, φ: phi, θ: angle * 180 / π };
  },
  
  /**
   * Gaussian: Φ₀(x, y) = A · exp(-((x-x₀)² + (y-y₀)²) / (2σ²))
   * Parameters: A (amplitude), x₀, y₀ (center), σ (width)
   * 
   * Mathematical: Radially symmetric, decays exponentially
   */
  gaussian: (field, params) => {

      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        const rSq = (x - x0) * (x - x0) + (y - y0) * (y - y0);
        field.set(i, j, A * Math.exp(-rSq / twoSigmaSq));
      }
    }
    
    return { type: 'gaussian', A, x: x0, y: y0, σ: sigma };
  },
  
  /**
   * Ring: Φ₀(x, y) = A · exp(-((r - r₀)²) / (2σ²))
   * where r = √((x-x₀)² + (y-y₀)²)
   * 
   * Mathematical: Annular Gaussian, centered at (x₀, y₀)

  ring: (field, params) => {

    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        const r = Math.sqrt((x - x0) * (x - x0) + (y - y0) * (y - y0));
        const dr = r - r0;
        field.set(i, j, A * Math.exp(-dr * dr / twoSigmaSq));
      }
    }
    
    return { type: 'ring', A, x: x0, y: y0, r: r0, σ: sigma };
  },
  
  /**
   * Radial wave: Φ₀(x, y) = A · sin(k·r + φ)
   * where r = √((x-x₀)² + (y-y₀)²)
   * 
   * Mathematical: Concentric rings emanating from center
   */
  radial: (field, params) => {
    const A = params.A ?? 1;
    const x0 = params.x ?? field.width / 2;
    const y0 = params.y ?? field.height / 2;
    const lambda = params.λ ?? params.lambda ?? 50;
    const k = τ / lambda;
    const phi = params.φ ?? params.phi ?? 0;
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        const r = Math.sqrt((x - x0) * (x - x0) + (y - y0) * (y - y0));
        field.set(i, j, A * Math.sin(k * r + phi));
      }
    }
    
    return { type: 'radial', A, x: x0, y: y0, λ: lambda, φ: phi };
  },
  
  /**
   * Spiral: Φ₀(x, y) = A · sin(k·r + m·θ + φ)
   * where r, θ are polar coordinates
   * 
   * Mathematical: m is the number of spiral arms
   */
  spiral: (field, params) => {
    const A = params.A ?? 1;

    const y0 = params.y ?? field.height / 2;
    const lambda = params.λ ?? params.lambda ?? 50;

        const y = j * field.dy - y0;
        const r = Math.sqrt(x * x + y * y);
        const theta = Math.atan2(y, x);
        field.set(i, j, A * Math.sin(k * r + m * theta + phi));
      }
    }
    
    return { type: 'spiral', A, x: x0, y: y0, λ: lambda, m, φ: phi };
  },
  
  /**
   * Checkerboard: Φ₀(x, y) = A · sign(sin(kx·x) · sin(ky·y))

        const y = j * field.dy;
        const value = Math.sin(k * x) * Math.sin(k * y);
        field.set(i, j, A * Math.sign(value));
      }

    return { type: 'checkerboard', A, size };

  /**
   * Noise: Random field
   * Mathematical: Φ₀(x, y) ~ Uniform(0, A)
   */
  noise: (field, params) => {
    const A = params.A ?? 1;
    const seed = params.seed ?? Date.now();
    
    // Simple PRNG for reproducibility
    let state = seed;
    const random = () => {
      state = (state * 1103515245 + 12345) & 0x7fffffff;
      return state / 0x7fffffff;
    };
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        field.set(i, j, A * random());

    }
    
    return { type: 'noise', A, seed };
  },
  
  /**
   * Constant: Φ₀(x, y) = c
   * Mathematical: Uniform field
   */
  constant: (field, params) => {
    const c = params.c ?? params.value ?? 0.5;
    
    for (let k = 0; k < field.data.length; k++) {
      field.data[k] = c;
    }

  /**

  interference: (field, params) => {

        const r2 = Math.sqrt((x - x2) * (x - x2) + (y - cy) * (y - cy));

  // ════════════════════════════════════════════════════════════════════════════

// SECTION 5: EVOLUTION OPERATORS
// Mathematical: ∂Φ/∂t = L[Φ] where L is a differential operator
// Implemented via time stepping: Φ(t+Δt) ≈ Φ(t) + Δt · L[Φ(t)]
// ════════════════════════════════════════════════════════════════════════════

const EVOLUTION_OPERATORS = {
  /**
   * Advection: ∂Φ/∂t = -c · ∇Φ
   * 
   * Mathematical: Transport of field along direction c
   * Solution: Φ(x, t) = Φ₀(x - c·t)
   * 
   * This makes waves propagate in direction of c
   */
  advect: (field, dt, params) => {
    const cx = params.cx ?? params.c ?? 1;  // x-velocity
    const cy = params.cy ?? 0;               // y-velocity
    
    // Semi-Lagrangian advection (unconditionally stable)
    const newField = field.clone();
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        // Trace back to where particle came from
        const x = i * field.dx - cx * dt;
        const y = j * field.dy - cy * dt;
        
        // Sample field at departure point
        newField.set(i, j, field.sample(
          ((x % field.width) + field.width) % field.width,
          ((y % field.height) + field.height) % field.height
        ));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'advect', cx, cy };
  },
  
  /**
   * Diffusion: ∂Φ/∂t = D · ∇²Φ
   * 
   * Mathematical: Heat equation - field spreads out over time
   * Smooths features, approaches uniform distribution
   */
  diffuse: (field, dt, params) => {
    const D = params.D ?? 0.1;  // Diffusion coefficient
    
    const newField = field.clone();
    
    // Stability constraint: dt < dx²/(4D)
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * D));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const lap = field.laplacian(i, j);
        newField.set(i, j, field.get(i, j) + dtStable * D * lap);
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'diffuse', D, dt_used: dtStable };
  },
  
  /**
   * Wave equation: ∂²Φ/∂t² = c² · ∇²Φ
   * 
   * Mathematical: Second-order in time, requires velocity field
   * Preserves wave structure (no damping)
   */
  wave: (field, dt, params) => {
    const c = params.c ?? 1;  // Wave speed
    const cSq = c * c;
    
    // Initialize velocity field if needed
    if (!field.velocity) {
      field.velocity = new Float32Array(field.nx * field.ny);
    }
    
    const newField = field.clone();
    const newVel = new Float32Array(field.velocity);
    
    // Stability constraint: dt < dx / c
    const dtStable = Math.min(dt, field.dx / c);
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const k = i + j * field.nx;
        const lap = field.laplacian(i, j);
        
        // Update velocity: ∂v/∂t = c²·∇²Φ
        newVel[k] = field.velocity[k] + dtStable * cSq * lap;
        
        // Update field: ∂Φ/∂t = v
        newField.set(i, j, field.get(i, j) + dtStable * newVel[k]);
      }
    }
    
    field.data.set(newField.data);
    field.velocity = newVel;
    return { operator: 'wave', c, dt_used: dtStable };
  },
  
  /**
   * Rotation: Apply global rotation to the field
   * θ(t) = θ₀ + ω·t
   * 
   * Mathematical: Rotation in physical space, not in field value
   */
  rotate: (field, dt, params) => {
    const omega = params.ω ?? params.omega ?? 0.1;  // Angular velocity
    const cx = params.cx ?? field.width / 2;
    const cy = params.cy ?? field.height / 2;
    
    const dTheta = omega * dt;

          const diffusion = eta * lap;

          const bistable = mu * phi * (1 - phi * phi);  // Bounded: pushes toward ±1
          const decay = -nu * phi;
          const feedback = alpha * delta_drift * phi;
          
          const dPhidt = diffusion + steepening + bistable + decay + feedback;
          
          let newVal = phi + dtSub * dPhidt;
          newVal = Math.max(-clamp, Math.min(clamp, newVal));
          
          newField.set(i, j, newVal);
        }
      }
      
      field.data.set(newField.data);
      field.memory = newMemory;
    }
    
    return { 
      operator: 'css', 
      η: eta, λ: lambda, μ: mu, ν: nu, 
      α: alpha, γ: gamma_mem, τ: threshold,
      substeps: nSubsteps
    };
  },
  
  // ════════════════════════════════════════════════════════════════════════════
  // PHASE 4: CLA^ (Collapse Logic Algebra) Operators
  // Transform continuous field dynamics into discrete logic states
  // ════════════════════════════════════════════════════════════════════════════
  
  /**
   * CLA Evolution: Compute and visualize Collapse Logic Algebra
   * Overwrites field with CLA state values [0-6] for visualization
   * 
   * This is a DIAGNOSTIC operator - use with colormap=cla
   * 
   * States:
   *   0: VOID   - No shells (ground)
   *   1: PASS   - Signal propagates
   *   2: AND    - Conjunction (converging shells)
   *   3: OR     - Disjunction (diverging shells)
   *   4: NOT    - Negation (enclosed region)
   *   5: XOR    - Exclusive or (perpendicular crossing)
   *   6: LATCH  - Memory lock (dense shells)
   * 
   * ITT: This is the bridge from continuous collapse to discrete computation
   */
  cla_view: (field, dt, params) => {
    const kSigma = params.k ?? params.kσ ?? 1.0;  // Shell detection threshold
    
    // Compute CLA field
    const { cla, shellMask, threshold } = field.claField(kSigma);
    
    // Overwrite field data with normalized CLA states
    for (let k = 0; k < cla.length; k++) {
      field.data[k] = cla[k] / 6;  // Normalize to [0,1] for colormap
    }
    
    // Compute stats for logging
    const stats = {VOID:0, PASS:0, AND:0, OR:0, NOT:0, XOR:0, LATCH:0};
    const names = ['VOID', 'PASS', 'AND', 'OR', 'NOT', 'XOR', 'LATCH'];
    for (let k = 0; k < cla.length; k++) {
      const state = Math.round(cla[k]);
      if (state >= 0 && state <= 6) stats[names[state]]++;
    }
    
    return { 
      operator: 'cla_view', 
      threshold,
      ...stats
    };
  },
  
  /**
   * CLA-Driven CSS: Evolution modulated by logic states
   * Uses CLA^ to control which regions evolve
   * 
   * AND regions: Both diffusion and reaction active
   * OR regions: Either diffusion or reaction (alternating)
   * NOT regions: Inverted dynamics
   * XOR regions: Phase-shifted evolution
   * LATCH regions: Frozen (no evolution)
   * 
   * ITT: Logic gates emerge from and control field dynamics
   */
  cla_css: (field, dt, params) => {
    const eta = params.η ?? params.eta ?? 1.0;
    const mu = params.μ ?? params.mu ?? 0.5;
    const kSigma = params.k ?? params.kσ ?? 1.0;
    const clamp = params.clamp ?? 1.5;
    
    // Compute CLA field
    const { cla, shellMask } = field.claField(kSigma);
    
    // Stability
    const dtSafe = Math.min(dt, field.dx * field.dx / (4 * Math.max(eta, 0.01)), 0.1);
    const nSubsteps = Math.max(1, Math.ceil(dt / dtSafe));
    const dtSub = dt / nSubsteps;
    
    for (let step = 0; step < nSubsteps; step++) {
      const newField = field.clone();
      
      for (let j = 0; j < field.ny; j++) {
        for (let i = 0; i < field.nx; i++) {
          const k = i + j * field.nx;
          const phi = field.get(i, j);
          const lap = field.laplacian(i, j);
          const state = Math.round(cla[k]);
          
          let dPhidt = 0;
          
          switch (state) {
            case 0:  // VOID - standard diffusion
              dPhidt = eta * lap;
              break;
            case 1:  // PASS - standard CSS
              dPhidt = eta * lap + mu * phi * (1 - phi * phi);
              break;
            case 2:  // AND - enhanced reaction
              dPhidt = eta * lap + 2 * mu * phi * (1 - phi * phi);
              break;
            case 3:  // OR - enhanced diffusion
              dPhidt = 2 * eta * lap + mu * phi * (1 - phi * phi);
              break;
            case 4:  // NOT - inverted reaction
              dPhidt = eta * lap - mu * phi * (1 - phi * phi);
              break;
            case 5:  // XOR - alternating sign
              dPhidt = eta * lap + mu * phi * (phi * phi - 1);  // Inverted bistable
              break;
            case 6:  // LATCH - frozen
              dPhidt = 0;
              break;
          }
          
          let newVal = phi + dtSub * dPhidt;
          newVal = Math.max(-clamp, Math.min(clamp, newVal));
          newField.set(i, j, newVal);
        }
      }
      
      field.data.set(newField.data);
    }
    
    return { operator: 'cla_css', η: eta, μ: mu, substeps: nSubsteps };
  },
  
  /**
   * CLA Gate Counter: Evolve CSS and log gate counts
   * Useful for tracking how logic emerges from dynamics
   */
  cla_count: (field, dt, params) => {
    // First evolve with standard CSS
    const cssResult = EVOLUTION_OPERATORS.collapse(field, dt, params);
    
    // Then compute CLA stats
    const kSigma = params.k ?? params.kσ ?? 1.0;
    const stats = field.claStats(kSigma);
    
    return { 
      operator: 'cla_count',
      ...cssResult,
      cla: stats
    };
  },
  
  // ════════════════════════════════════════════════════════════════════════════
  // PHASE 6: Σ (Symbol Emission) Operators
  // Σ = g(ρq, CLA^, Ω^)
  // Discrete tokens emerge from continuous dynamics
  // ════════════════════════════════════════════════════════════════════════════
  
  /**
   * SIGMA: Full CSS evolution with symbol emission
   * Σ = g(ρq, CLA^, Ω^)
   * 
   * This is the complete pipeline:
   *   Φ evolves → Ω^ remembers → CLA^ classifies → Σ emits
   * 
   * The system SPEAKS - emitting discrete tokens from continuous dynamics.
   * 
   * Symbols emitted:
   *   ρ - Shell formation
   *   λ - LATCH lock  
   *   ∧ - AND gate fires
   *   ∨ - OR gate fires
   *   ¬ - NOT context
   *   ⊕ - XOR crossing
   *   Ω - Memory threshold
   *   ↓ - Collapse
   *   ↑ - Expansion
   *   • - Pulse
   *   ∅ - Void expansion
   *   ∞ - Saturation
   */
  sigma: (field, dt, params, t, initialParams) => {
    // Initialize emitter if needed
    if (!field.emitter) {
      field.emitter = new SymbolEmitter({
        shellThreshold: params.shellThresh ?? 0.05,
        memoryThreshold: params.memThresh ?? 0.3,
        gateThreshold: params.gateThresh ?? 30,
        latchFrames: params.latchFrames ?? 2
      });
    }
    
    // First evolve with full CSS (includes memory and drift)
    const cssResult = EVOLUTION_OPERATORS.css(field, dt, params);
    
    // Then process for symbol emission
    const emitted = field.emitter.process(field, t, cssResult);
    
    // Build result with symbol info
    const result = {
      operator: 'sigma',
      ...cssResult,
      symbols: {
        emitted: emitted.map(s => s.char).join(''),
        sequence: field.emitter.getSequence(),
        total: field.emitter.buffer.length
      }
    };
    
    // Add emitted symbols to result for logging
    if (emitted.length > 0) {
      result.Σ = emitted.map(s => `${s.char}(${s.name})`).join(' ');
    }
    
    return result;
  },
  
  /**
   * SIGMA_VIEW: Visualize symbol emission locations
   * Shows WHERE symbols are being emitted in the field
   * 
   * Uses colormap to show:
   *   - Low values: quiet regions
   *   - High values: active emission regions (shells, gates, memory)
   */
  sigma_view: (field, dt, params, t, initialParams) => {
    // First run normal sigma evolution
    const sigmaResult = EVOLUTION_OPERATORS.sigma(field, dt, params, t, initialParams);
    
    // Compute emission intensity field
    // Combine: shell mask + CLA gate density + memory
    const { mask: shellMask } = field.shellMask(1.0);
    const { cla } = field.claField(1.0);
    
    // Build composite "emission potential" field
    for (let k = 0; k < field.data.length; k++) {
      let intensity = 0;
      
      // Shell contribution (ρq)
      if (shellMask[k] > 0) intensity += 0.3;
      
      // CLA gate contribution
      const state = Math.round(cla[k]);
      if (state === 2) intensity += 0.4;      // AND
      else if (state === 3) intensity += 0.3; // OR
      else if (state === 4) intensity += 0.2; // NOT
      else if (state === 5) intensity += 0.35; // XOR
      else if (state === 6) intensity += 0.5; // LATCH
      
      // Memory contribution (Ω^)
      if (field.memory && field.memory[k] > 0.3) {
        intensity += 0.3 * field.memory[k];
      }
      
      field.data[k] = Math.min(1, intensity);
    }
    
    return {
      ...sigmaResult,
      operator: 'sigma_view'
    };
  },
  
  /**
   * SIGMA_COLLAPSE: CSS collapse with symbol tracking
   * Simplified version without memory feedback
   * Good for seeing basic emission patterns
   */
  sigma_collapse: (field, dt, params, t, initialParams) => {
    // Initialize emitter if needed
    if (!field.emitter) {
      field.emitter = new SymbolEmitter({
        shellThreshold: params.shellThresh ?? 0.08,
        gateThreshold: params.gateThresh ?? 40
      });
    }
    
    // Evolve with collapse (simpler than full CSS)
    const collapseResult = EVOLUTION_OPERATORS.collapse(field, dt, params);
    
    // Process for symbols
    const emitted = field.emitter.process(field, t, collapseResult);
    
    return {
      operator: 'sigma_collapse',
      ...collapseResult,
      symbols: {
        emitted: emitted.map(s => s.char).join(''),
        sequence: field.emitter.getSequence(),
        total: field.emitter.buffer.length
      },
      Σ: emitted.length > 0 ? emitted.map(s => s.char).join('') : undefined
    };
  },
  
  /**
   * SIGMA_ALLEN_CAHN: Allen-Cahn with symbol emission
   * Track symbols during domain coarsening
   */
  sigma_allen_cahn: (field, dt, params, t, initialParams) => {
    if (!field.emitter) {
      field.emitter = new SymbolEmitter({
        shellThreshold: params.shellThresh ?? 0.1,
        gateThreshold: params.gateThresh ?? 30
      });
    }
    
    const acResult = EVOLUTION_OPERATORS.allen_cahn(field, dt, params);
    const emitted = field.emitter.process(field, t, acResult);
    
    return {
      operator: 'sigma_allen_cahn',
      ...acResult,
      symbols: {
        emitted: emitted.map(s => s.char).join(''),
        sequence: field.emitter.getSequence(),
        total: field.emitter.buffer.length
      },
      Σ: emitted.length > 0 ? emitted.map(s => s.char).join('') : undefined
    };
  },
  
  // ════════════════════════════════════════════════════════════════════════════
  // PHASE 7: AGI OPERATORS
  // CTL (Collapse Transform Lifting), Learning, and Optimization
  // These are the REAL AGI mechanics - not metaphor
  // ════════════════════════════════════════════════════════════════════════════
  
  /**
   * CTL: Collapse Transform Lifting
   * Soft selection over discrete transforms using Gumbel-softmax
   * 
   * T_θ(Φ) = Σᵢ αᵢ(θ) · Tᵢ(Φ), where Σαᵢ = 1
   * 
   * This SOLVES the discrete-continuous gap:
   * - Transforms remain discrete (rotate, tile, etc.)
   * - Selection becomes differentiable via softmax
   * 
   * Available transforms:
   *   - identity: No change
   *   - rotate90/180/270: Rotation
   *   - flipH/flipV: Reflection
   *   - invert: Φ → -Φ
   *   - normalize: Scale to [-1, 1]
   *   - smooth: Gaussian blur
   */
  ctl: (field, dt, params, t, initialParams) => {
    // Transform library
    const transforms = {
      identity: (f) => f,
      rotate90: (f) => {
        const result = f.clone();
        for (let j = 0; j < f.ny; j++) {
          for (let i = 0; i < f.nx; i++) {
            result.set(f.ny - 1 - j, i, f.get(i, j));
          }
        }
        return result;
      },
      rotate180: (f) => {
        const result = f.clone();
        for (let j = 0; j < f.ny; j++) {
          for (let i = 0; i < f.nx; i++) {
            result.set(f.nx - 1 - i, f.ny - 1 - j, f.get(i, j));
          }
        }
        return result;
      },
      flipH: (f) => {
        const result = f.clone();
        for (let j = 0; j < f.ny; j++) {
          for (let i = 0; i < f.nx; i++) {
            result.set(f.nx - 1 - i, j, f.get(i, j));
          }
        }
        return result;
      },
      flipV: (f) => {
        const result = f.clone();
        for (let j = 0; j < f.ny; j++) {
          for (let i = 0; i < f.nx; i++) {
            result.set(i, f.ny - 1 - j, f.get(i, j));
          }
        }
        return result;
      },
      invert: (f) => {
        const result = f.clone();
        for (let k = 0; k < f.data.length; k++) {
          result.data[k] = -f.data[k];
        }
        return result;
      },
      normalize: (f) => {
        const result = f.clone();
        const [min, max] = f.range();
        const range = max - min || 1;
        for (let k = 0; k < f.data.length; k++) {
          result.data[k] = 2 * (f.data[k] - min) / range - 1;
        }
        return result;
      },
      smooth: (f) => {
        const result = f.clone();
        for (let j = 1; j < f.ny - 1; j++) {
          for (let i = 1; i < f.nx - 1; i++) {
            let sum = 0;
            for (let dj = -1; dj <= 1; dj++) {
              for (let di = -1; di <= 1; di++) {
                sum += f.get(i + di, j + dj);
              }
            }
            result.set(i, j, sum / 9);
          }
        }
        return result;
      }
    };
    
    // Get weights from params (or use uniform)
    const transformNames = Object.keys(transforms);
    const weights = params.weights ?? transformNames.map(() => 1 / transformNames.length);
    const temperature = params.τ ?? params.temperature ?? 1.0;
    
    // Gumbel-softmax for differentiable selection
    const gumbel = () => -Math.log(-Math.log(Math.random() + 1e-10) + 1e-10);
    const logits = weights.map((w, i) => Math.log(w + 1e-10) + gumbel());
    const maxLogit = Math.max(...logits);
    const expLogits = logits.map(l => Math.exp((l - maxLogit) / temperature));
    const sumExp = expLogits.reduce((a, b) => a + b, 0);
    const alpha = expLogits.map(e => e / sumExp);
    
    // Apply soft mixture of transforms
    const results = transformNames.map(name => transforms[name](field));
    
    // Weighted combination
    for (let k = 0; k < field.data.length; k++) {
      let sum = 0;
      for (let i = 0; i < results.length; i++) {
        sum += alpha[i] * results[i].data[k];
      }
      field.data[k] = sum;
    }
    
    // Also evolve with CSS if specified
    if (params.evolve !== false) {
      EVOLUTION_OPERATORS.css(field, dt, params);
    }
    
    // Find dominant transform
    const maxIdx = alpha.indexOf(Math.max(...alpha));
    const dominant = transformNames[maxIdx];
    
    return {
      operator: 'ctl',
      transforms: transformNames,
      alpha: Object.fromEntries(transformNames.map((n, i) => [n, alpha[i].toFixed(3)])),
      dominant: dominant,
      temperature: temperature
    };
  },
  
  /**
   * LEARN: Optimize toward target pattern
   * 
   * min_θ L(Φ_θ) where L = ||Φ - Φ*||₁ + λE(Φ)
   * 
   * This implements REAL LEARNING:
   * - Loss function measures distance to target
   * - Parameters update based on gradient signal
   * - System converges toward goal state
   * 
   * Requires: target field set via spec.target
   */
  learn: (field, dt, params, t, initialParams, targetField) => {
    const lambda = params.λ ?? params.lambda ?? 0.01;
    const learningRate = params.lr ?? params.learningRate ?? 0.1;
    const beta = params.β ?? params.beta ?? 0.1;  // Curiosity weight
    
    // Store previous state for curiosity
    const previous = field.clone();
    
    // Evolve with CSS
    const cssResult = EVOLUTION_OPERATORS.css(field, dt, params);
    
    // Compute loss if target exists
    let lossInfo = { total: 0, sigma: 0, energy: 0 };
    if (targetField) {
      lossInfo = field.totalLoss(targetField, lambda);
      
      // Gradient-like update: move field toward target
      // This is a simplified gradient step: Φ ← Φ - lr * (Φ - Φ*)
      for (let k = 0; k < field.data.length; k++) {
        const error = field.data[k] - targetField.data[k];
        field.data[k] -= learningRate * error * dt;
      }
    }
    
    // Compute curiosity (interest measure)
    const curiosity = field.curiosity(previous);
    
    // Combined objective: minimize loss, maximize curiosity
    const objective = lossInfo.total - beta * curiosity;
    
    return {
      operator: 'learn',
      ...cssResult,
      loss: {
        total: lossInfo.total.toFixed(4),
        σ: lossInfo.sigma.toFixed(4),
        E: lossInfo.energy.toFixed(4)
      },
      curiosity: curiosity.toFixed(4),
      objective: objective.toFixed(4),
      hasTarget: !!targetField
    };
  },
  
  /**
   * OPTIMIZE: Full optimization loop with beam search
   * 
   * T* = argmin_T L(T(Φ))
   * 
   * Searches over transform compositions to find best match to target.
   * This is the ITT v5B beam search adapted for GIF physics.
   */
  optimize: (field, dt, params, t, initialParams, targetField) => {
    if (!targetField) {
      // No target - just evolve normally
      return EVOLUTION_OPERATORS.css(field, dt, params);
    }
    
    const beamWidth = params.beam ?? 5;
    const lambda = params.λ ?? params.lambda ?? 0.01;
    
    // Simple transforms to search over
    const transforms = [
      { name: 'css', apply: (f) => { EVOLUTION_OPERATORS.css(f, dt, params); return f; } },
      { name: 'diffuse', apply: (f) => { EVOLUTION_OPERATORS.diffuse(f, dt, { D: 1 }); return f; } },
      { name: 'allen_cahn', apply: (f) => { EVOLUTION_OPERATORS.allen_cahn(f, dt, { ε: 1 }); return f; } },
      { name: 'smooth', apply: (f) => {
          for (let j = 1; j < f.ny - 1; j++) {
            for (let i = 1; i < f.nx - 1; i++) {
              f.set(i, j, (f.get(i-1,j) + f.get(i+1,j) + f.get(i,j-1) + f.get(i,j+1)) / 4);
            }
          }
          return f;
        }
      }
    ];
    
    // Beam search: try each transform, keep best
    let bestField = field.clone();
    let bestLoss = field.totalLoss(targetField, lambda).total;
    let bestTransform = 'none';
    
    for (const T of transforms) {
      const testField = field.clone();
      T.apply(testField);
      const loss = testField.totalLoss(targetField, lambda).total;
      
      if (loss < bestLoss) {
        bestLoss = loss;
        bestField = testField;
        bestTransform = T.name;
      }
    }
    
    // Apply best transform
    field.data.set(bestField.data);
    
    return {
      operator: 'optimize',
      bestTransform: bestTransform,
      loss: bestLoss.toFixed(4),
      searchedTransforms: transforms.length
    };
  },
  
  /**
   * TARGET_MATCH: Visualize distance to target
   * Renders σ-field showing where field differs from target
   */
  target_match: (field, dt, params, t, initialParams, targetField) => {
    if (!targetField) {
      return { operator: 'target_match', error: 'No target specified' };
    }
    
    // First evolve
    const cssResult = EVOLUTION_OPERATORS.css(field, dt, params);
    
    // Compute σ-field
    const sigma = field.sigmaField(targetField);
    
    // Overwrite field with σ for visualization
    const maxSigma = Math.max(...sigma) || 1;
    for (let k = 0; k < field.data.length; k++) {
      field.data[k] = sigma[k] / maxSigma;
    }
    
    const loss = field.sigmaLoss(targetField);
    
    return {
      operator: 'target_match',
      ...cssResult,
      σ_total: loss.toFixed(4),
      σ_max: maxSigma.toFixed(4)
    };
  },
  
  /**
   * None: No evolution (static field)
   */
  none: (field, dt, params) => {
    return { operator: 'none' };
  }
};


// ════════════════════════════════════════════════════════════════════════════
// SECTION 6: PARSER
// Converts mathematical notation to internal representation
// ════════════════════════════════════════════════════════════════════════════

/**
 * Parse the physics specification
 * 
 * Format:
 *   Φ₀ = type(param1=value1, param2=value2)
 *   Φ* = type(params)        // TARGET PATTERN (Phase 7: AGI)
 *   ∂Φ/∂t = operator(param1=value1)
 *   t ∈ [start, end], Δt = step
 *   canvas = width×height
 *   colormap = name
 *   mode = learn|optimize   // Learning mode (Phase 7: AGI)
 */
function parsePhysicsSpec(input) {
  const spec = {
    initial: { type: 'wave', params: {} },
    target: null,  // Phase 7: Target pattern Φ* for learning
    evolution: { type: 'none', params: {} },
    time: { start: 0, end: τ, dt: π/4 },
    canvas: { width: 400, height: 400 },
    colormap: 'plasma',
    normalize: true,
    mode: 'simulate'  // 'simulate' | 'learn' | 'optimize'
  };
  
  const lines = input.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
  
  for (const line of lines) {
    // Initial condition: Φ₀ = type(params) or Φ = type(params)
    const initialMatch = line.match(/^[Φφ]₀?\s*=\s*(\w+)\s*\(([^)]*)\)\s*$/i);
    if (initialMatch) {
      spec.initial.type = initialMatch[1].toLowerCase();
      spec.initial.params = parseParams(initialMatch[2]);
      continue;
    }
    
    // TARGET PATTERN (Phase 7: AGI): Φ* = type(params)
    const targetMatch = line.match(/^[Φφ]\*\s*=\s*(\w+)\s*\(([^)]*)\)\s*$/i);
    if (targetMatch) {
      spec.target = {
        type: targetMatch[1].toLowerCase(),
        params: parseParams(targetMatch[2])
      };
      continue;
    }
    
    // MODE (Phase 7: AGI): mode = learn|optimize|simulate
    const modeMatch = line.match(/^mode\s*=\s*(learn|optimize|simulate)$/i);
    if (modeMatch) {
      spec.mode = modeMatch[1].toLowerCase();
      continue;
    }
    
    // Evolution: ∂Φ/∂t = operator(params) or dΦ/dt = ... or evolve = ...
    const evolveMatch = line.match(/^(?:∂[Φφ]\/∂t|d[Φφ]\/dt|evolve)\s*=\s*(\w+)\s*\(([^)]*)\)\s*$/i);
    if (evolveMatch) {
      spec.evolution.type = evolveMatch[1].toLowerCase();
      spec.evolution.params = parseParams(evolveMatch[2]);
      continue;
    }
    
    // Time domain: t ∈ [start, end], Δt = step
    const timeMatch = line.match(/^t\s*[∈∊∋]\s*\[\s*([^,]+)\s*,\s*([^\]]+)\s*\]\s*,?\s*[Δδ]t\s*=\s*(.+)$/i);
    if (timeMatch) {
      spec.time.start = evalMathExpr(timeMatch[1]);
      spec.time.end = evalMathExpr(timeMatch[2]);
      spec.time.dt = evalMathExpr(timeMatch[3]);
      continue;
    }
    
    // Simple time: frames = N or n = N
    const framesMatch = line.match(/^(?:frames|n)\s*=\s*(\d+)$/i);
    if (framesMatch) {
      const n = parseInt(framesMatch[1]);
      spec.time.dt = (spec.time.end - spec.time.start) / n;
      continue;
    }
    
    // Canvas: canvas = width×height or canvas = WxH
    const canvasMatch = line.match(/^canvas\s*=\s*(\d+)\s*[×x]\s*(\d+)$/i);
    if (canvasMatch) {
      spec.canvas.width = parseInt(canvasMatch[1]);
      spec.canvas.height = parseInt(canvasMatch[2]);
      continue;
    }
    
    // Colormap: colormap = name
    const colormapMatch = line.match(/^colormap\s*=\s*(\w+)$/i);
    if (colormapMatch) {
      spec.colormap = colormapMatch[1].toLowerCase();
      continue;
    }
    
    // Normalize: normalize = true/false
    const normalizeMatch = line.match(/^normalize\s*=\s*(true|false)$/i);
    if (normalizeMatch) {
      spec.normalize = normalizeMatch[1].toLowerCase() === 'true';
      continue;
    }
  }
  
  // Calculate number of frames
  spec.time.nFrames = Math.ceil((spec.time.end - spec.time.start) / spec.time.dt);
  
  return spec;
}

/**
 * Parse parameter list: "param1=value1, param2=value2"
 */
function parseParams(str) {
  const params = {};
  if (!str.trim()) return params;
  
  const parts = str.split(',');
  for (const part of parts) {
    const [key, value] = part.split('=').map(s => s.trim());
    if (key && value !== undefined) {
      // Handle Greek letters in keys
      const normalizedKey = key
        .replace(/λ/g, 'lambda')
        .replace(/σ/g, 'sigma')
        .replace(/φ/g, 'phi')
        .replace(/θ/g, 'theta')
        .replace(/ω/g, 'omega');
      
      params[normalizedKey] = evalMathExpr(value);
      // Also keep original Greek key
      params[key] = params[normalizedKey];
    }
  }
  return params;
}

/**
 * Evaluate mathematical expression
 * Supports: numbers, π, τ, e, basic arithmetic
 */
function evalMathExpr(str) {
  str = str.trim();
  
  // Direct number
  if (/^-?\d+\.?\d*$/.test(str)) {
    return parseFloat(str);
  }
  
  // Replace mathematical constants
  let expr = str
    .replace(/π/g, `(${π})`)
    .replace(/τ/g, `(${τ})`)
    .replace(/\\pi/g, `(${π})`)
    .replace(/\\tau/g, `(${τ})`)
    .replace(/pi/gi, `(${π})`)
    .replace(/tau/gi, `(${τ})`)
    .replace(/\be\b/g, `(${e})`);
  
  // Safe eval using Function
  try {
    const result = new Function(`return ${expr}`)();
    return typeof result === 'number' ? result : parseFloat(str) || 0;
  } catch {
    return parseFloat(str) || 0;
  }
}

// SECTION 7: RENDERER
// Converts field state to canvas pixels
// ════════════════════════════════════════════════════════════════════════════

/**
 * Render a scalar field to a canvas context
 */
function renderField(ctx, field, colormap, normalize = true) {
  const width = ctx.canvas.width;
  const height = ctx.canvas.height;
  const imageData = ctx.createImageData(width, height);
  const data = imageData.data;
  
  // Get field range for normalization
  let [min, max] = field.range();
  
  if (!normalize) {
    min = -1;
    max = 1;
  }
  
  // Avoid division by zero
  const range = max - min || 1;
  
  // Get colormap function
  const colorFn = COLORMAPS[colormap] || COLORMAPS.plasma;
  
  // Map field to pixels
  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      // Map pixel coordinates to field coordinates
      const fx = Math.floor(px * field.nx / width);
      const fy = Math.floor(py * field.ny / height);
      
      // Get field value and normalize to [0, 1]
      const value = field.get(fx, fy);
      const t = clamp((value - min) / range, 0, 1);
      
      // Get color
      const [r, g, b] = colorFn(t);
      
      // Set pixel
      const idx = (py * width + px) * 4;
      data[idx] = r;
      data[idx + 1] = g;
      data[idx + 2] = b;
      data[idx + 3] = 255;
    }
  }
  
  ctx.putImageData(imageData, 0, 0);
}
