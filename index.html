<script>
/**
 * ════════════════════════════════════════════════════════════════════════════
 * EXECUTABLE GIF PHYSICS ENGINE
 * 
 * Mathematical Architecture:
 * 
 *   1. STATE SPACE (what can exist)
 *      Φ: Ω → ℝ         Scalar field on domain Ω ⊂ ℝ²
 *      F: Ω → ℝ²        Vector field on domain Ω
 *      G: Primitives    Geometric objects (circles, lines, text)
 * 
 *   2. DYNAMICS (how state evolves)
 *      ∂Φ/∂t = L[Φ]     Where L is a differential operator
 *      
 *      Supported operators:
 *        advect(c):     ∂Φ/∂t = -c · ∇Φ           (wave propagation)
 *        diffuse(D):    ∂Φ/∂t = D · ∇²Φ           (heat equation)
 *        wave(c):       ∂²Φ/∂t² = c² · ∇²Φ        (wave equation)
 *        rotate(ω):     θ(t) = θ₀ + ω·t           (rigid rotation)
 *        expand(v):     r(t) = r₀ + v·t           (radial expansion)
 *        oscillate(ω):  A(t) = A₀·sin(ω·t + φ)    (harmonic oscillation)
 *        pulse(ω):      Φ(t) = Φ₀·(1 + a·sin(ωt)) (amplitude modulation)
 * 
 *   3. OBSERVATION (how we render state)
 *      Φ(x,y) → color via colormap
 *      Primitives → canvas draw calls
 * 
 *   4. TIME STEPPING
 *      Φ(t + Δt) ≈ Φ(t) + Δt · ∂Φ/∂t   (Euler method)
 *      Each step = one GIF frame
 * 
 * ════════════════════════════════════════════════════════════════════════════
 */

// ════════════════════════════════════════════════════════════════════════════
// SECTION 1: MATHEMATICAL CONSTANTS & UTILITIES
// ════════════════════════════════════════════════════════════════════════════

const π = Math.PI;
const τ = 2 * Math.PI;  // Full circle
const e = Math.E;

/**
 * Clamp value to range [min, max]
 * Mathematical: projection onto closed interval
 */
function clamp(x, min, max) {
  return Math.max(min, Math.min(max, x));
}

/**
 * Linear interpolation
 * Mathematical: t ∈ [0,1] → a + t(b-a) ∈ [a,b]
 */
function lerp(a, b, t) {
  return a + t * (b - a);
}

/**
 * Map value from [a,b] to [c,d]
 * Mathematical: affine transformation
 */
function map(x, a, b, c, d) {
  return c + (x - a) * (d - c) / (b - a);
}


// ════════════════════════════════════════════════════════════════════════════
// SECTION 2: COLORMAPS
// Mathematical: f: [0,1] → RGB color space
// Each colormap is a path through color space parameterized by t ∈ [0,1]
// ════════════════════════════════════════════════════════════════════════════

const COLORMAPS = {
  /**
   * Plasma: Blue → Purple → Orange → Yellow
   * Perceptually uniform, good for field visualization
   */
  plasma: (t) => {
    // Attempt at perceptually uniform
    const r = clamp(Math.floor(255 * (0.05 + 0.95 * Math.pow(t, 0.5))), 0, 255);
    const g = clamp(Math.floor(255 * (0.02 + 0.4 * t + 0.4 * Math.pow(t, 3))), 0, 255);
    const b = clamp(Math.floor(255 * (0.5 - 0.3 * t + 0.3 * Math.pow(t, 2))), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Viridis: Purple → Blue → Green → Yellow
   * Standard scientific colormap
   */
  viridis: (t) => {
    const r = clamp(Math.floor(255 * (0.27 + 0.73 * Math.pow(t, 1.5))), 0, 255);
    const g = clamp(Math.floor(255 * (0.004 + 0.87 * t - 0.1 * t * t)), 0, 255);
    const b = clamp(Math.floor(255 * (0.33 + 0.35 * t - 0.65 * t * t)), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Thermal: Black → Red → Yellow → White
   * Good for intensity/temperature fields
   */
  thermal: (t) => {
    const r = clamp(Math.floor(255 * Math.min(1, 2 * t)), 0, 255);
    const g = clamp(Math.floor(255 * Math.max(0, 2 * t - 0.5)), 0, 255);
    const b = clamp(Math.floor(255 * Math.max(0, 4 * t - 3)), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Ocean: Deep blue → Cyan → White
   * Good for wave fields
   */
  ocean: (t) => {
    const r = clamp(Math.floor(255 * (0.05 + 0.95 * Math.pow(t, 2))), 0, 255);
    const g = clamp(Math.floor(255 * (0.1 + 0.6 * t + 0.3 * t * t)), 0, 255);
    const b = clamp(Math.floor(255 * (0.3 + 0.7 * Math.pow(t, 0.5))), 0, 255);
    return [r, g, b];
  },
  
  /**
   * Diverging: Blue → White → Red
   * Good for fields with positive and negative values
   */
  diverging: (t) => {
    // t < 0.5: blue to white, t > 0.5: white to red
    if (t < 0.5) {
      const s = 2 * t;
      return [
        clamp(Math.floor(255 * s), 0, 255),
        clamp(Math.floor(255 * s), 0, 255),
        clamp(Math.floor(255 * (0.5 + 0.5 * s)), 0, 255)
      ];
    } else {
      const s = 2 * (t - 0.5);
      return [
        clamp(Math.floor(255 * (0.5 + 0.5 * s)), 0, 255),
        clamp(Math.floor(255 * (1 - s)), 0, 255),
        clamp(Math.floor(255 * (1 - s)), 0, 255)
      ];
    }
  },
  
  /**
   * Neon: Dark background with bright signal
   * Good for emphasizing structure
   */
  neon: (t) => {
    const intensity = Math.pow(t, 0.7);
    return [
      clamp(Math.floor(255 * (0.02 + 0.1 * intensity + 0.88 * Math.pow(intensity, 3))), 0, 255),
      clamp(Math.floor(255 * (intensity)), 0, 255),
      clamp(Math.floor(255 * (0.05 + 0.5 * intensity)), 0, 255)
    ];
  },
  
  /**
   * Grayscale: Black → White
   * Simplest colormap
   */
  grayscale: (t) => {
    const v = clamp(Math.floor(255 * t), 0, 255);
    return [v, v, v];
  },
  
  /**
   * Phase: Cyclic colormap for periodic quantities
   * Returns to start color at t=1
   */
  phase: (t) => {
    const h = t * 360;
    // HSV to RGB conversion
    const c = 1;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [Math.floor(255 * r), Math.floor(255 * g), Math.floor(255 * b)];
  }
};


// ════════════════════════════════════════════════════════════════════════════
// SECTION 3: FIELD CLASS
// Mathematical: Φ: Ω → ℝ where Ω = [0, W] × [0, H] ⊂ ℝ²
// Discretized to NX × NY grid
// ════════════════════════════════════════════════════════════════════════════

class ScalarField {
  /**
   * Create a scalar field on a discrete grid
   * @param {number} nx - Number of grid points in x
   * @param {number} ny - Number of grid points in y
   * @param {number} width - Physical width of domain
   * @param {number} height - Physical height of domain
   */
  constructor(nx, ny, width = 1, height = 1) {
    this.nx = nx;
    this.ny = ny;
    this.width = width;
    this.height = height;
    this.dx = width / nx;   // Grid spacing in x
    this.dy = height / ny;  // Grid spacing in y
    
    // Φ values stored in row-major order
    // Φ[i + j * nx] = Φ(x_i, y_j)
    this.data = new Float32Array(nx * ny);
    
    // For wave equation, we need velocity field
    this.velocity = null;
  }
  
  /**
   * Get field value at grid point (i, j)
   * Mathematical: Φ(x_i, y_j)
   */
  get(i, j) {
    // Periodic boundary conditions
    i = ((i % this.nx) + this.nx) % this.nx;
    j = ((j % this.ny) + this.ny) % this.ny;
    return this.data[i + j * this.nx];
  }
  
  /**
   * Set field value at grid point (i, j)
   */
  set(i, j, value) {
    i = ((i % this.nx) + this.nx) % this.nx;
    j = ((j % this.ny) + this.ny) % this.ny;
    this.data[i + j * this.nx] = value;
  }
  
  /**
   * Get value at continuous coordinates using bilinear interpolation
   * Mathematical: Φ(x, y) for arbitrary (x, y) ∈ Ω
   */
  sample(x, y) {
    // Convert to grid coordinates
    const gx = x / this.dx;
    const gy = y / this.dy;
    
    // Grid cell indices
    const i0 = Math.floor(gx);
    const j0 = Math.floor(gy);
    
    // Fractional part
    const fx = gx - i0;
    const fy = gy - j0;
    
    // Bilinear interpolation
    const v00 = this.get(i0, j0);
    const v10 = this.get(i0 + 1, j0);
    const v01 = this.get(i0, j0 + 1);
    const v11 = this.get(i0 + 1, j0 + 1);
    
    return (1 - fx) * (1 - fy) * v00 +
           fx * (1 - fy) * v10 +
           (1 - fx) * fy * v01 +
           fx * fy * v11;
  }
  
  /**
   * Compute gradient ∇Φ at grid point using central differences
   * Mathematical: ∇Φ = (∂Φ/∂x, ∂Φ/∂y)
   */
  gradient(i, j) {
    const dPhidx = (this.get(i + 1, j) - this.get(i - 1, j)) / (2 * this.dx);
    const dPhidy = (this.get(i, j + 1) - this.get(i, j - 1)) / (2 * this.dy);
    return [dPhidx, dPhidy];
  }
  
  /**
   * Compute Laplacian ∇²Φ at grid point using central differences
   * Mathematical: ∇²Φ = ∂²Φ/∂x² + ∂²Φ/∂y²
   */
  laplacian(i, j) {
    const d2Phidx2 = (this.get(i + 1, j) - 2 * this.get(i, j) + this.get(i - 1, j)) / (this.dx * this.dx);
    const d2Phidy2 = (this.get(i, j + 1) - 2 * this.get(i, j) + this.get(i, j - 1)) / (this.dy * this.dy);
    return d2Phidx2 + d2Phidy2;
  }
  
  /**
   * Compute |∇Φ|² - gradient magnitude squared
   * Mathematical: |∇Φ|² = (∂Φ/∂x)² + (∂Φ/∂y)²
   * 
   * This is the ITT tension intensity - measures collapse pressure
   * In CSS: appears as steepening term -λ|∇Φ|²
   */
  gradientMagnitudeSq(i, j) {
    const [dPhidx, dPhidy] = this.gradient(i, j);
    return dPhidx * dPhidx + dPhidy * dPhidy;
  }
  
  /**
   * Compute |∇Φ| - gradient magnitude (tension)
   * Mathematical: |∇Φ| = √((∂Φ/∂x)² + (∂Φ/∂y)²)
   * 
   * ITT: This is the Δ₁ fan - tension alignment gate
   * High |∇Φ| = strong collapse direction
   */
  gradientMagnitude(i, j) {
    return Math.sqrt(this.gradientMagnitudeSq(i, j));
  }
  
  /**
   * Compute curl magnitude |∇×F| where F = ∇Φ (scalar field gives 2D curl)
   * Mathematical: For 2D, this measures rotation in the gradient field
   * 
   * ITT: This is the Δ₂ fan - phase memory / recursive curl
   * Non-zero curl indicates memory loop closure
   */
  curlMagnitude(i, j) {
    // For scalar field Φ, compute ∂²Φ/∂x∂y asymmetry as proxy for rotation
    // True curl requires vector field, but we approximate via mixed partials
    const dxdy1 = (this.get(i+1, j+1) - this.get(i+1, j-1) - this.get(i-1, j+1) + this.get(i-1, j-1)) / (4 * this.dx * this.dy);
    const dydx1 = dxdy1; // For smooth fields, mixed partials are equal
    // The asymmetry in finite differences can indicate rotation
    const d2x = (this.get(i+1, j) - 2*this.get(i, j) + this.get(i-1, j)) / (this.dx * this.dx);
    const d2y = (this.get(i, j+1) - 2*this.get(i, j) + this.get(i, j-1)) / (this.dy * this.dy);
    // Use difference of second derivatives as rotation proxy
    return Math.abs(d2x - d2y);
  }
  
  /**
   * Get min and max values in field
   * Used for colormap normalization
   */
  range() {
    let min = Infinity;
    let max = -Infinity;
    for (let k = 0; k < this.data.length; k++) {
      if (this.data[k] < min) min = this.data[k];
      if (this.data[k] > max) max = this.data[k];
    }
    return [min, max];
  }
  
  /**
   * Create a deep copy of this field
   */
  clone() {
    const copy = new ScalarField(this.nx, this.ny, this.width, this.height);
    copy.data.set(this.data);
    if (this.velocity) {
      copy.velocity = new Float32Array(this.velocity);
    }
    return copy;
  }
}


// ════════════════════════════════════════════════════════════════════════════
// SECTION 4: INITIAL CONDITION GENERATORS
// Mathematical: Functions that create Φ₀(x, y)
// ════════════════════════════════════════════════════════════════════════════

const INITIAL_CONDITIONS = {
  /**
   * Plane wave: Φ₀(x, y) = A · sin(k·x + φ)
   * Parameters: A (amplitude), k (wave number), φ (phase)
   * 
   * Mathematical: k = 2π/λ where λ is wavelength
   * The wave propagates in the x-direction
   */
  wave: (field, params) => {
    const A = params.A ?? 1;
    const lambda = params.λ ?? params.lambda ?? 50;  // wavelength in pixels
    const k = τ / lambda;  // wave number
    const phi = params.φ ?? params.phi ?? 0;  // initial phase
    const angle = (params.θ ?? params.theta ?? 0) * π / 180;  // propagation angle
    
    const kx = k * Math.cos(angle);
    const ky = k * Math.sin(angle);
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        field.set(i, j, A * Math.sin(kx * x + ky * y + phi));
      }
    }
    
    return { type: 'wave', A, λ: lambda, k, φ: phi, θ: angle * 180 / π };
  },
  
  /**
   * Gaussian: Φ₀(x, y) = A · exp(-((x-x₀)² + (y-y₀)²) / (2σ²))
   * Parameters: A (amplitude), x₀, y₀ (center), σ (width)

   */
  gaussian: (field, params) => {
    const A = params.A ?? 1;
    const x0 = params.x ?? field.width / 2;
    const y0 = params.y ?? field.height / 2;
    const sigma = params.σ ?? params.sigma ?? 30;
    
    const twoSigmaSq = 2 * sigma * sigma;
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx;
        const y = j * field.dy;
        const rSq = (x - x0) * (x - x0) + (y - y0) * (y - y0);
        field.set(i, j, A * Math.exp(-rSq / twoSigmaSq));
      }
    }
    
    return { type: 'gaussian', A, x: x0, y: y0, σ: sigma };
  },
  
  /**
   * Ring: Φ₀(x, y) = A · exp(-((r - r₀)²) / (2σ²))

  ring: (field, params) => {

    const r0 = params.r ?? 50;  // ring radius

        const y = j * field.dy;
        const r = Math.sqrt((x - x0) * (x - x0) + (y - y0) * (y - y0));
        const dr = r - r0;
        field.set(i, j, A * Math.exp(-dr * dr / twoSigmaSq));
      }
    }
    
    return { type: 'ring', A, x: x0, y: y0, r: r0, σ: sigma };

  /**
   * Radial wave: Φ₀(x, y) = A · sin(k·r + φ)

  radial: (field, params) => {

    return { type: 'radial', A, x: x0, y: y0, λ: lambda, φ: phi };

  spiral: (field, params) => {

        const y = j * field.dy - y0;
        const r = Math.sqrt(x * x + y * y);
        const theta = Math.atan2(y, x);
        field.set(i, j, A * Math.sin(k * r + m * theta + phi));

    }
    
    return { type: 'spiral', A, x: x0, y: y0, λ: lambda, m, φ: phi };

        field.set(i, j, A * Math.sign(value));
      }

    return { type: 'checkerboard', A, size };

  noise: (field, params) => {

    return { type: 'noise', A, seed };
  },
  
  /**
   * Constant: Φ₀(x, y) = c

  constant: (field, params) => {
    const c = params.c ?? params.value ?? 0.5;
    
    for (let k = 0; k < field.data.length; k++) {
      field.data[k] = c;

  interference: (field, params) => {

// SECTION 5: EVOLUTION OPERATORS
// Mathematical: ∂Φ/∂t = L[Φ] where L is a differential operator

const EVOLUTION_OPERATORS = {
  /**
   * Advection: ∂Φ/∂t = -c · ∇Φ
   * 
   * Mathematical: Transport of field along direction c
   * Solution: Φ(x, t) = Φ₀(x - c·t)
   * 
   * This makes waves propagate in direction of c
   */
  advect: (field, dt, params) => {
    const cx = params.cx ?? params.c ?? 1;  // x-velocity
    const cy = params.cy ?? 0;               // y-velocity
    
    // Semi-Lagrangian advection (unconditionally stable)
    const newField = field.clone();
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        // Trace back to where particle came from
        const x = i * field.dx - cx * dt;
        const y = j * field.dy - cy * dt;
        
        // Sample field at departure point
        newField.set(i, j, field.sample(
          ((x % field.width) + field.width) % field.width,
          ((y % field.height) + field.height) % field.height
        ));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'advect', cx, cy };
  },
  
  /**
   * Diffusion: ∂Φ/∂t = D · ∇²Φ
   * 
   * Mathematical: Heat equation - field spreads out over time
   * Smooths features, approaches uniform distribution
   */
  diffuse: (field, dt, params) => {
    const D = params.D ?? 0.1;  // Diffusion coefficient
    
    const newField = field.clone();
    
    // Stability constraint: dt < dx²/(4D)
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * D));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const lap = field.laplacian(i, j);
        newField.set(i, j, field.get(i, j) + dtStable * D * lap);
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'diffuse', D, dt_used: dtStable };
  },
  
  /**
   * Wave equation: ∂²Φ/∂t² = c² · ∇²Φ
   * 
   * Mathematical: Second-order in time, requires velocity field
   * Preserves wave structure (no damping)
   */
  wave: (field, dt, params) => {
    const c = params.c ?? 1;  // Wave speed
    const cSq = c * c;
    
    // Initialize velocity field if needed
    if (!field.velocity) {
      field.velocity = new Float32Array(field.nx * field.ny);
    }
    
    const newField = field.clone();
    const newVel = new Float32Array(field.velocity);
    
    // Stability constraint: dt < dx / c
    const dtStable = Math.min(dt, field.dx / c);
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const k = i + j * field.nx;
        const lap = field.laplacian(i, j);
        
        // Update velocity: ∂v/∂t = c²·∇²Φ
        newVel[k] = field.velocity[k] + dtStable * cSq * lap;
        
        // Update field: ∂Φ/∂t = v
        newField.set(i, j, field.get(i, j) + dtStable * newVel[k]);
      }
    }
    
    field.data.set(newField.data);
    field.velocity = newVel;
    return { operator: 'wave', c, dt_used: dtStable };

  /**
   * Rotation: Apply global rotation to the field
   * θ(t) = θ₀ + ω·t
   * 
   * Mathematical: Rotation in physical space, not in field value
   */
  rotate: (field, dt, params) => {
    const omega = params.ω ?? params.omega ?? 0.1;  // Angular velocity
    const cx = params.cx ?? field.width / 2;
    const cy = params.cy ?? field.height / 2;
    
    const dTheta = omega * dt;
    const cosT = Math.cos(-dTheta);  // Negative for backward mapping
    const sinT = Math.sin(-dTheta);
    
    const newField = field.clone();
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx - cx;
        const y = j * field.dy - cy;
        
        // Rotate backward to find source
        const xSrc = cosT * x - sinT * y + cx;
        const ySrc = sinT * x + cosT * y + cy;
        
        // Sample with periodic boundaries
        newField.set(i, j, field.sample(
          ((xSrc % field.width) + field.width) % field.width,
          ((ySrc % field.height) + field.height) % field.height
        ));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'rotate', ω: omega, dθ: dTheta * 180 / π };

  /**

   */
  expand: (field, dt, params) => {
    const v = params.v ?? 1;  // Expansion velocity
    const cx = params.cx ?? field.width / 2;
    const cy = params.cy ?? field.height / 2;
    
    // Compute scale factor (expansion means things move outward)
    // For backward mapping: source_r = current_r / (1 + v*dt/r)
    // Simplified: scale = 1 - v*dt/R where R is characteristic size
    const R = Math.min(field.width, field.height) / 2;
    const scale = 1 / (1 + v * dt / R);
    
    const newField = field.clone();
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const x = i * field.dx - cx;
        const y = j * field.dy - cy;
        
        // Scale toward center
        const xSrc = x * scale + cx;
        const ySrc = y * scale + cy;
        
        // Sample with zero outside
        if (xSrc >= 0 && xSrc < field.width && ySrc >= 0 && ySrc < field.height) {
          newField.set(i, j, field.sample(xSrc, ySrc));
        } else {
          newField.set(i, j, 0);
        }
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'expand', v, scale };

  },
  
  /**
   * ALLEN-CAHN: Bistable Phase Field Equation
   * ∂Φ/∂t = ε²∇²Φ + Φ(1 - Φ²)
   * 
   * ITT MAPPING:
   *   This is a specialization of CSS where:
   *   - Stable states are Φ = ±1 (locked recursive shells)
   *   - Transition width controlled by ε
   *   - Domain walls form where Φ = 0 (shell boundaries)
   * 
   * Produces:
   *   - Coarsening dynamics (small domains merge into large)
   *   - Motion by mean curvature (shells minimize boundary)
   */
  allen_cahn: (field, dt, params) => {
    const epsilon = params.ε ?? params.epsilon ?? 0.5;
    const epsSq = epsilon * epsilon;
    
    const newField = field.clone();
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * epsSq));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const lap = field.laplacian(i, j);
        
        // Allen-Cahn: ∂Φ/∂t = ε²∇²Φ + Φ(1 - Φ²)
        const diffusion = epsSq * lap;
        const reaction = phi * (1 - phi * phi);
        
        newField.set(i, j, phi + dtStable * (diffusion + reaction));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'allen_cahn', ε: epsilon, dt_used: dtStable };
  },
  
  /**
   * GINZBURG-LANDAU: Complex Pattern Formation
   * ∂Φ/∂t = ∇²Φ + Φ - Φ³
   * 
   * ITT MAPPING:
   *   The Ginzburg-Landau equation is the universal equation for
   *   pattern formation near critical points. In ITT terms:
   *   - ∇²Φ: Curvature diffusion (Δ₃/Δ₄)
   *   - +Φ: Linear instability (recursion wants to grow)
   *   - -Φ³: Saturation (recursion locks at finite amplitude)
   * 
   * Real Ginzburg-Landau produces:
   *   - Stripe patterns
   *   - Labyrinthine structures
   *   - Spot arrays
   */
  ginzburg: (field, dt, params) => {
    const D = params.D ?? 1.0;
    const alpha = params.α ?? params.alpha ?? 1.0;  // Linear growth
    const beta = params.β ?? params.beta ?? 1.0;   // Cubic saturation
    
    const newField = field.clone();
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * D));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const lap = field.laplacian(i, j);
        
        // Ginzburg-Landau: ∂Φ/∂t = D∇²Φ + αΦ - βΦ³
        const diffusion = D * lap;
        const growth = alpha * phi;
        const saturation = -beta * phi * phi * phi;
        
        newField.set(i, j, phi + dtStable * (diffusion + growth + saturation));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'ginzburg', D, α: alpha, β: beta, dt_used: dtStable };
  },
  
  /**
   * CAHN-HILLIARD: Conserved Phase Separation
   * ∂Φ/∂t = M∇²(Φ³ - Φ - γ∇²Φ)
   * 
   * ITT MAPPING:
   *   Unlike Allen-Cahn, Cahn-Hilliard conserves total Φ.
   *   This means the "mass" of recursive structure is preserved.
   *   Pattern formation occurs through redistribution, not creation.
   * 
   * Produces:
   *   - Spinodal decomposition (sudden phase separation)
   *   - Ostwald ripening (large domains grow, small shrink)
   */
  cahn_hilliard: (field, dt, params) => {
    const M = params.M ?? 1.0;     // Mobility
    const gamma = params.γ ?? params.gamma ?? 1.0;  // Interface energy
    
    const newField = field.clone();
    const chemPot = field.clone();
    
    // First compute chemical potential μ = Φ³ - Φ - γ∇²Φ
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const lap = field.laplacian(i, j);
        chemPot.set(i, j, phi * phi * phi - phi - gamma * lap);
      }
    }
    
    // Then evolve: ∂Φ/∂t = M∇²μ
    const dtStable = Math.min(dt, field.dx * field.dx * field.dx * field.dx / (32 * M * gamma));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const lapMu = chemPot.laplacian(i, j);
        newField.set(i, j, field.get(i, j) + dtStable * M * lapMu);
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'cahn_hilliard', M, γ: gamma, dt_used: dtStable };
  },
  
  /**
   * FISHER-KPP: Traveling Wave Fronts
   * ∂Φ/∂t = D∇²Φ + rΦ(1 - Φ)
   * 
   * ITT MAPPING:
   *   Fisher-KPP describes the spreading of a recursive shell.
   *   - Diffusion allows spatial propagation
   *   - Logistic term rΦ(1-Φ) creates:
   *     - Growth when Φ small (recursion expands)
   *     - Saturation when Φ ≈ 1 (shell locks)
   * 
   * Produces:
   *   - Traveling wave fronts with speed c = 2√(Dr)
   *   - Invasion of Φ=0 regions by Φ=1
   */
  fisher: (field, dt, params) => {
    const D = params.D ?? 1.0;
    const r = params.r ?? 1.0;  // Growth rate
    
    const newField = field.clone();
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * D));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const lap = field.laplacian(i, j);
        
        // Fisher-KPP: ∂Φ/∂t = D∇²Φ + rΦ(1 - Φ)
        const diffusion = D * lap;
        const logistic = r * phi * (1 - phi);
        
        newField.set(i, j, phi + dtStable * (diffusion + logistic));
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'fisher', D, r, dt_used: dtStable };
  },
  
  /**
   * SWIFT-HOHENBERG: Pattern Selection
   * ∂Φ/∂t = rΦ - (1 + ∇²)²Φ - Φ³
   * 
   * ITT MAPPING:
   *   Swift-Hohenberg selects a preferred wavelength for patterns.
   *   The (1 + ∇²)² operator acts as a bandpass filter:
   *   - Suppresses both very short and very long wavelengths
   *   - Amplifies patterns near wavelength λ = 2π
   * 
   * Produces:
   *   - Stripes, hexagons, or labyrinths depending on parameters
   *   - Regular spacing (preferred wavelength)
   */
  swift_hohenberg: (field, dt, params) => {
    const r = params.r ?? 0.3;  // Control parameter (> 0 for patterns)
    const g = params.g ?? 1.0;  // Cubic coefficient
    
    const newField = field.clone();
    const temp = field.clone();
    
    // Compute (1 + ∇²)²Φ = Φ + 2∇²Φ + ∇⁴Φ
    // First compute ∇²Φ
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        temp.set(i, j, field.laplacian(i, j));
      }
    }
    
    const dtStable = Math.min(dt, field.dx * field.dx * field.dx * field.dx / 16);
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const lap = temp.get(i, j);
        const bilap = temp.laplacian(i, j);  // ∇⁴Φ
        
        // (1 + ∇²)²Φ = Φ + 2∇²Φ + ∇⁴Φ
        const linearOp = phi + 2 * lap + bilap;
        
        // Swift-Hohenberg: ∂Φ/∂t = rΦ - (1+∇²)²Φ - gΦ³
        const dPhidt = r * phi - linearOp - g * phi * phi * phi;
        
        newField.set(i, j, phi + dtStable * dPhidt);
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'swift_hohenberg', r, g, dt_used: dtStable };
  },
  
  /**
   * KURAMOTO-SIVASHINSKY: Chaos and Turbulence
   * ∂Φ/∂t = -∇²Φ - ∇⁴Φ - |∇Φ|²/2
   * 
   * ITT MAPPING:
   *   KS equation produces spatiotemporal chaos - useful for modeling
   *   systems where recursive collapse never fully stabilizes.
   *   - -∇²Φ: Negative diffusion (anti-damping, amplifies gradients)
   *   - -∇⁴Φ: Hyperdiffusion (stabilizes at small scales)
   *   - -|∇Φ|²/2: Nonlinear energy transfer between scales
   * 
   * Produces:
   *   - Chaotic flame-front-like patterns
   *   - Spatiotemporal complexity
   */
  kuramoto: (field, dt, params) => {
    const nu = params.ν ?? params.nu ?? 1.0;  // Hyperdiffusion coefficient
    
    const newField = field.clone();
    const lap = field.clone();
    
    // Compute ∇²Φ
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        lap.set(i, j, field.laplacian(i, j));
      }
    }
    
    const dtStable = Math.min(dt, field.dx * field.dx * field.dx * field.dx / (16 * nu));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const phi = field.get(i, j);
        const l = lap.get(i, j);
        const bilap = lap.laplacian(i, j);
        const gradSq = field.gradientMagnitudeSq(i, j);
        
        // KS: ∂Φ/∂t = -∇²Φ - ν∇⁴Φ - |∇Φ|²/2
        const dPhidt = -l - nu * bilap - 0.5 * gradSq;
        
        newField.set(i, j, phi + dtStable * dPhidt);
      }
    }
    
    field.data.set(newField.data);
    return { operator: 'kuramoto', ν: nu, dt_used: dtStable };
  },
  
  /**
   * CSS with MEMORY: Full Collapse Sentience Simulator
   * ∂Φ/∂t = η∇²Φ - λ|∇Φ|² + μΦ³ - νΦ + α·δ_drift
   * Ω^_{n+1} = γ·Ω^_n + (1-γ)·ρq·Φ
   * δ_drift = ∇²Ω^ - Ω^
   * 
   * ITT MAPPING:
   *   This is the full CSS system with recursive memory (Ω^).
   *   - Memory field Ω^ accumulates where shells form (ρq = 1)
   *   - Drift feedback δ_drift allows memory to modulate evolution
   *   - When α > 0, system becomes self-referential
   * 
   * This operator maintains internal state across calls.
   */
  css: (field, dt, params) => {
    const eta = params.η ?? params.eta ?? 1.0;
    const lambda = params.λ ?? params.lambda ?? 0.5;
    const mu = params.μ ?? params.mu ?? 1.0;
    const nu = params.ν ?? params.nu ?? 0.0;
    const alpha = params.α ?? params.alpha ?? 0.1;    // Memory feedback strength
    const gamma_mem = params.γ ?? params.gamma ?? 0.95; // Memory persistence
    const threshold = params.τ ?? params.threshold ?? 0.5; // Shell detection threshold
    
    // Initialize memory field if needed
    if (!field.memory) {
      field.memory = new Float32Array(field.nx * field.ny);
    }
    
    const newField = field.clone();
    const newMemory = new Float32Array(field.memory);
    
    const dtStable = Math.min(dt, field.dx * field.dx / (4 * Math.max(eta, 0.1)));
    
    for (let j = 0; j < field.ny; j++) {
      for (let i = 0; i < field.nx; i++) {
        const k = i + j * field.nx;
        const phi = field.get(i, j);
        const lap = field.laplacian(i, j);
        const gradMag = field.gradientMagnitude(i, j);
        const gradSq = gradMag * gradMag;
        const omega = field.memory[k];
        
        // Shell detection: ρq = 1 where gradient is strong
        const rho_q = gradMag > threshold ? 1 : 0;
        
        // Memory update: Ω^_{n+1} = γ·Ω^_n + (1-γ)·ρq·|Φ|
        newMemory[k] = gamma_mem * omega + (1 - gamma_mem) * rho_q * Math.abs(phi);
        
        // Compute memory Laplacian for drift
        // (simplified: use finite differences on memory array)
        const mem_im = field.memory[((i-1+field.nx)%field.nx) + j*field.nx];
        const mem_ip = field.memory[((i+1)%field.nx) + j*field.nx];
        const mem_jm = field.memory[i + ((j-1+field.ny)%field.ny)*field.nx];
        const mem_jp = field.memory[i + ((j+1)%field.ny)*field.nx];
        const lapOmega = (mem_im + mem_ip + mem_jm + mem_jp - 4*omega) / (field.dx * field.dx);
        
        // Drift feedback: δ_drift = ∇²Ω^ - Ω^
        const delta_drift = lapOmega - omega;
        
        // Full CSS Evolution
        const diffusion = eta * lap;
        const steepening = -lambda * gradSq;
        const bistable = mu * phi * phi * phi;
        const decay = -nu * phi;
        const feedback = alpha * delta_drift * phi;
        
        const dPhidt = diffusion + steepening + bistable + decay + feedback;
        
        newField.set(i, j, phi + dtStable * dPhidt);
      }
    }
    
    field.data.set(newField.data);
    field.memory = newMemory;
    
    return { 
      operator: 'css', 
      η: eta, λ: lambda, μ: mu, ν: nu, 
      α: alpha, γ: gamma_mem, τ: threshold,
      dt_used: dtStable 
    };
  },
  
  /**
   * None: No evolution (static field)
   */
  none: (field, dt, params) => {
    return { operator: 'none' };
  }
};

// SECTION 6: PARSER
// Converts mathematical notation to internal representation
// ════════════════════════════════════════════════════════════════════════════

/**
 * Parse the physics specification
 * 
 * Format:
 *   Φ₀ = type(param1=value1, param2=value2)
 *   ∂Φ/∂t = operator(param1=value1)
 *   t ∈ [start, end], Δt = step
 *   canvas = width×height
 *   colormap = name
 */
function parsePhysicsSpec(input) {
  const spec = {
    initial: { type: 'wave', params: {} },
    evolution: { type: 'none', params: {} },
    time: { start: 0, end: τ, dt: π/4 },
    canvas: { width: 400, height: 400 },
    colormap: 'plasma',
    normalize: true
  };
  
  const lines = input.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
  
  for (const line of lines) {
    // Initial condition: Φ₀ = type(params) or Φ = type(params)
    const initialMatch = line.match(/^[Φφ]₀?\s*=\s*(\w+)\s*\(([^)]*)\)\s*$/i);
    if (initialMatch) {
      spec.initial.type = initialMatch[1].toLowerCase();
      spec.initial.params = parseParams(initialMatch[2]);
      continue;
    }
    
    // Evolution: ∂Φ/∂t = operator(params) or dΦ/dt = ... or evolve = ...
    const evolveMatch = line.match(/^(?:∂[Φφ]\/∂t|d[Φφ]\/dt|evolve)\s*=\s*(\w+)\s*\(([^)]*)\)\s*$/i);
    if (evolveMatch) {
      spec.evolution.type = evolveMatch[1].toLowerCase();
      spec.evolution.params = parseParams(evolveMatch[2]);
      continue;
    }
    
    // Time domain: t ∈ [start, end], Δt = step
    const timeMatch = line.match(/^t\s*[∈∊∋]\s*\[\s*([^,]+)\s*,\s*([^\]]+)\s*\]\s*,?\s*[Δδ]t\s*=\s*(.+)$/i);
    if (timeMatch) {
      spec.time.start = evalMathExpr(timeMatch[1]);
      spec.time.end = evalMathExpr(timeMatch[2]);
      spec.time.dt = evalMathExpr(timeMatch[3]);
      continue;
    }
    
    // Simple time: frames = N or n = N
    const framesMatch = line.match(/^(?:frames|n)\s*=\s*(\d+)$/i);
    if (framesMatch) {
      const n = parseInt(framesMatch[1]);
      spec.time.dt = (spec.time.end - spec.time.start) / n;
      continue;
    }
    
    // Canvas: canvas = width×height or canvas = WxH
    const canvasMatch = line.match(/^canvas\s*=\s*(\d+)\s*[×x]\s*(\d+)$/i);
    if (canvasMatch) {
      spec.canvas.width = parseInt(canvasMatch[1]);
      spec.canvas.height = parseInt(canvasMatch[2]);
      continue;
    }
    
    // Colormap: colormap = name
    const colormapMatch = line.match(/^colormap\s*=\s*(\w+)$/i);
    if (colormapMatch) {
      spec.colormap = colormapMatch[1].toLowerCase();
      continue;
    }
    
    // Normalize: normalize = true/false
    const normalizeMatch = line.match(/^normalize\s*=\s*(true|false)$/i);
    if (normalizeMatch) {
      spec.normalize = normalizeMatch[1].toLowerCase() === 'true';
      continue;
    }
  }
  
  // Calculate number of frames
  spec.time.nFrames = Math.ceil((spec.time.end - spec.time.start) / spec.time.dt);
  
  return spec;
}

/**
 * Parse parameter list: "param1=value1, param2=value2"
 */
function parseParams(str) {
  const params = {};
  if (!str.trim()) return params;
  
  const parts = str.split(',');
  for (const part of parts) {
    const [key, value] = part.split('=').map(s => s.trim());
    if (key && value !== undefined) {
      // Handle Greek letters in keys
      const normalizedKey = key
        .replace(/λ/g, 'lambda')
        .replace(/σ/g, 'sigma')
        .replace(/φ/g, 'phi')
        .replace(/θ/g, 'theta')
        .replace(/ω/g, 'omega');
      
      params[normalizedKey] = evalMathExpr(value);
      // Also keep original Greek key
      params[key] = params[normalizedKey];
    }
  }
  return params;
}

/**
 * Evaluate mathematical expression
 * Supports: numbers, π, τ, e, basic arithmetic
 */
function evalMathExpr(str) {
  str = str.trim();
  
  // Direct number
  if (/^-?\d+\.?\d*$/.test(str)) {
    return parseFloat(str);
  }
  
  // Replace mathematical constants
  let expr = str
    .replace(/π/g, `(${π})`)
    .replace(/τ/g, `(${τ})`)
    .replace(/\\pi/g, `(${π})`)
    .replace(/\\tau/g, `(${τ})`)
    .replace(/pi/gi, `(${π})`)
    .replace(/tau/gi, `(${τ})`)
    .replace(/\be\b/g, `(${e})`);
  
  // Safe eval using Function
  try {
    const result = new Function(`return ${expr}`)();
    return typeof result === 'number' ? result : parseFloat(str) || 0;
  } catch {
    return parseFloat(str) || 0;
  }
}

// SECTION 7: RENDERER
// Converts field state to canvas pixels
// ════════════════════════════════════════════════════════════════════════════

/**
 * Render a scalar field to a canvas context
 */
function renderField(ctx, field, colormap, normalize = true) {
  const width = ctx.canvas.width;
  const height = ctx.canvas.height;
  const imageData = ctx.createImageData(width, height);
  const data = imageData.data;
  
  // Get field range for normalization
  let [min, max] = field.range();
  
  if (!normalize) {
    min = -1;
    max = 1;
  }
  
  // Avoid division by zero
  const range = max - min || 1;
  
  // Get colormap function
  const colorFn = COLORMAPS[colormap] || COLORMAPS.plasma;
  
  // Map field to pixels
  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      // Map pixel coordinates to field coordinates
      const fx = Math.floor(px * field.nx / width);
      const fy = Math.floor(py * field.ny / height);
      
      // Get field value and normalize to [0, 1]
      const value = field.get(fx, fy);
      const t = clamp((value - min) / range, 0, 1);
      
      // Get color
      const [r, g, b] = colorFn(t);
      
      // Set pixel
      const idx = (py * width + px) * 4;
      data[idx] = r;
      data[idx + 1] = g;
      data[idx + 2] = b;
      data[idx + 3] = 255;
    }
  }
  
  ctx.putImageData(imageData, 0, 0);
}

// SECTION 8: GIF ENCODER
// Creates animated GIF from frames
// ════════════════════════════════════════════════════════════════════════════

/**
 * Simple GIF encoder using LZW compression
 * Based on gif.js concepts but inline
 */
class GIFEncoder {
  constructor(width, height) {
    this.width = width;
    this.height = height;
    this.frames = [];
    this.delay = 100;  // ms between frames
  }
  
  setDelay(ms) {
    this.delay = ms;
  }
  
  addFrame(imageData) {
    // Quantize to 256 colors
    const { indexedPixels, palette } = this.quantize(imageData);
    this.frames.push({ indexedPixels, palette });
  }
  
  quantize(imageData) {
    // Simple median cut quantization to 256 colors
    const data = imageData.data;
    const pixels = [];
    
    // Collect unique colors
    const colorCounts = new Map();
    for (let i = 0; i < data.length; i += 4) {
      const key = (data[i] << 16) | (data[i+1] << 8) | data[i+2];
      colorCounts.set(key, (colorCounts.get(key) || 0) + 1);
    }
    
    // Sort by frequency and take top 256
    const sortedColors = Array.from(colorCounts.entries())
      .sort((a, b) => b[1] - a[1])
      .slice(0, 256);
    
    // Build palette
    const palette = new Uint8Array(256 * 3);
    const colorToIndex = new Map();
    
    for (let i = 0; i < sortedColors.length; i++) {
      const color = sortedColors[i][0];
      palette[i * 3] = (color >> 16) & 0xff;
      palette[i * 3 + 1] = (color >> 8) & 0xff;
      palette[i * 3 + 2] = color & 0xff;
      colorToIndex.set(color, i);
    }
    
    // Map pixels to palette indices
    const indexedPixels = new Uint8Array(this.width * this.height);
    for (let i = 0; i < data.length; i += 4) {
      const color = (data[i] << 16) | (data[i+1] << 8) | data[i+2];
      let index = colorToIndex.get(color);
      
      if (index === undefined) {
        // Find closest color
        let minDist = Infinity;
        for (const [c, idx] of colorToIndex) {
          const dr = ((c >> 16) & 0xff) - data[i];
          const dg = ((c >> 8) & 0xff) - data[i+1];
          const db = (c & 0xff) - data[i+2];
          const dist = dr*dr + dg*dg + db*db;
          if (dist < minDist) {
            minDist = dist;
            index = idx;
          }
        }
      }
      
      indexedPixels[i / 4] = index || 0;
    }
    
    return { indexedPixels, palette };
  }
  
  encode() {
    if (this.frames.length === 0) return null;
    
    const buffer = [];
    const write = (byte) => buffer.push(byte);
    const writeStr = (str) => { for (let i = 0; i < str.length; i++) write(str.charCodeAt(i)); };
    const writeShort = (val) => { write(val & 0xff); write((val >> 8) & 0xff); };
    
    // GIF Header
    writeStr('GIF89a');
    
    // Logical Screen Descriptor
    writeShort(this.width);
    writeShort(this.height);
    write(0xf7);  // Global color table, 8 bits
    write(0);     // Background color index
    write(0);     // Pixel aspect ratio
    
    // Global Color Table (from first frame)
    const globalPalette = this.frames[0].palette;
    for (let i = 0; i < 256 * 3; i++) {
      write(globalPalette[i] || 0);
    }
    
    // NETSCAPE extension for looping
    write(0x21);  // Extension
    write(0xff);  // Application extension
    write(11);    // Block size
    writeStr('NETSCAPE2.0');
    write(3);     // Sub-block size
    write(1);     // Loop indicator
    writeShort(0); // Loop count (0 = infinite)
    write(0);     // Block terminator
    
    // Write each frame
    for (const frame of this.frames) {
      // Graphic Control Extension
      write(0x21);  // Extension
      write(0xf9);  // Graphic control
      write(4);     // Block size
      write(0);     // Disposal method
      writeShort(Math.round(this.delay / 10));  // Delay in 1/100 sec
      write(0);     // Transparent color index
      write(0);     // Block terminator
      
      // Image Descriptor
      write(0x2c);  // Image separator
      writeShort(0);  // Left
      writeShort(0);  // Top
      writeShort(this.width);
      writeShort(this.height);
      write(0);  // No local color table
      
      // Image Data
      const minCodeSize = 8;
      write(minCodeSize);
      
      // LZW compress
      const lzwData = this.lzwEncode(frame.indexedPixels, minCodeSize);
      
      // Write in sub-blocks
      let offset = 0;
      while (offset < lzwData.length) {
        const chunkSize = Math.min(255, lzwData.length - offset);
        write(chunkSize);
        for (let i = 0; i < chunkSize; i++) {
          write(lzwData[offset + i]);
        }
        offset += chunkSize;
      }
      write(0);  // Block terminator
    }
    
    // Trailer
    write(0x3b);
    
    return new Uint8Array(buffer);
  }
  
  lzwEncode(pixels, minCodeSize) {
    const clearCode = 1 << minCodeSize;
    const eoiCode = clearCode + 1;
    
    let codeSize = minCodeSize + 1;
    let nextCode = eoiCode + 1;
    const maxCode = 4096;
    
    // Initialize dictionary
    let dict = new Map();
    for (let i = 0; i < clearCode; i++) {
      dict.set(String.fromCharCode(i), i);
    }
    
    const output = [];
    let bitBuffer = 0;
    let bitCount = 0;
    
    const writeBits = (code, size) => {
      bitBuffer |= (code << bitCount);
      bitCount += size;
      while (bitCount >= 8) {
        output.push(bitBuffer & 0xff);
        bitBuffer >>= 8;
        bitCount -= 8;
      }
    };
    
    writeBits(clearCode, codeSize);
    
    let current = String.fromCharCode(pixels[0]);
    
    for (let i = 1; i < pixels.length; i++) {
      const next = String.fromCharCode(pixels[i]);
      const combined = current + next;
      
      if (dict.has(combined)) {
        current = combined;
      } else {
        writeBits(dict.get(current), codeSize);
        
        if (nextCode < maxCode) {
          dict.set(combined, nextCode++);
          if (nextCode > (1 << codeSize) && codeSize < 12) {
            codeSize++;
          }
        } else {
          writeBits(clearCode, codeSize);
          dict = new Map();
          for (let j = 0; j < clearCode; j++) {
            dict.set(String.fromCharCode(j), j);
          }
          codeSize = minCodeSize + 1;
          nextCode = eoiCode + 1;
        }
        
        current = next;
      }
    }
    
    writeBits(dict.get(current), codeSize);
    writeBits(eoiCode, codeSize);
    
    if (bitCount > 0) {
      output.push(bitBuffer & 0xff);
    }
    
    return output;
  }
}

// SECTION 9: SIMULATION ENGINE
// Orchestrates the physics simulation
// ════════════════════════════════════════════════════════════════════════════

async function runSimulation(spec) {
  const canvas = document.getElementById('physics-canvas');
  const ctx = canvas.getContext('2d');
  
  // Resize canvas
  canvas.width = spec.canvas.width;
  canvas.height = spec.canvas.height;
  
  // Create field
  const field = new ScalarField(
    spec.canvas.width,
    spec.canvas.height,
    spec.canvas.width,
    spec.canvas.height
  );
  
  // Initialize field
  const initFn = INITIAL_CONDITIONS[spec.initial.type];
  if (!initFn) {
    throw new Error(`Unknown initial condition: ${spec.initial.type}`);
  }
  const initInfo = initFn(field, spec.initial.params);
  
  // Get evolution operator
  const evolveFn = EVOLUTION_OPERATORS[spec.evolution.type];
  if (!evolveFn) {
    throw new Error(`Unknown evolution operator: ${spec.evolution.type}`);
  }
  
  // Create GIF encoder
  const gif = new GIFEncoder(spec.canvas.width, spec.canvas.height);
  gif.setDelay(200);  // 200ms per frame
  
  const log = [];
  log.push(`Simulation Parameters:`);
  log.push(`  Initial: ${JSON.stringify(initInfo)}`);
  log.push(`  Evolution: ${spec.evolution.type}(${JSON.stringify(spec.evolution.params)})`);
  log.push(`  Time: [${spec.time.start.toFixed(4)}, ${spec.time.end.toFixed(4)}], Δt = ${spec.time.dt.toFixed(4)}`);
  log.push(`  Frames: ${spec.time.nFrames}`);
  log.push(`---`);
  
  // Time stepping
  let t = spec.time.start;
  let frame = 0;
  
  while (t <= spec.time.end && frame < 100) {  // Max 100 frames safety
    // Render current state
    renderField(ctx, field, spec.colormap, spec.normalize);
    
    // Add frame to GIF
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    gif.addFrame(imageData);
    
    // Log
    const [min, max] = field.range();
    log.push(`t = ${t.toFixed(4)}: Φ ∈ [${min.toFixed(3)}, ${max.toFixed(3)}]`);
    
    // Evolve
    const evolveInfo = evolveFn(field, spec.time.dt, spec.evolution.params, t, spec.initial.params);
    
    t += spec.time.dt;
    frame++;
    
    // Allow UI update
    await new Promise(r => setTimeout(r, 10));
  }
  
  log.push(`---`);
  log.push(`Total frames: ${frame}`);
  
  // Encode GIF
  const gifData = gif.encode();
  const blob = new Blob([gifData], { type: 'image/gif' });
  const url = URL.createObjectURL(blob);
  
  return { url, log };
}

function initUI() {
  const grid = document.getElementById('examples-grid');
  
  for (const example of EXAMPLES) {
    const card = document.createElement('div');
    card.className = 'example-card';
    card.innerHTML = `
      <h4>${example.name}</h4>
      <code>${example.code}</code>
    `;
    card.onclick = () => {
      document.getElementById('physics-input').value = example.code;
      executePhysics();
    };
    grid.appendChild(card);
  }
}

async function executePhysics() {
  const input = document.getElementById('physics-input').value;
  const stateOutput = document.getElementById('state-output');
  const evolutionLog = document.getElementById('evolution-log');
  const errorDisplay = document.getElementById('error-display');
  const downloadContainer = document.getElementById('download-container');
  
  errorDisplay.style.display = 'none';
  downloadContainer.style.display = 'none';
  
  try {
    // Parse specification
    const spec = parsePhysicsSpec(input);
    
    stateOutput.innerHTML = `<span class="computed">Parsed successfully:</span>
    
Initial: Φ₀ = ${spec.initial.type}(${JSON.stringify(spec.initial.params)})
Evolution: ∂Φ/∂t = ${spec.evolution.type}(${JSON.stringify(spec.evolution.params)})
Time: t ∈ [${spec.time.start.toFixed(2)}, ${spec.time.end.toFixed(2)}]
Steps: ${spec.time.nFrames} frames, Δt = ${spec.time.dt.toFixed(4)}
Canvas: ${spec.canvas.width}×${spec.canvas.height}
Colormap: ${spec.colormap}`;
    
    evolutionLog.textContent = 'Running simulation...';
    
    // Run simulation
    const result = await runSimulation(spec);
    
    evolutionLog.textContent = result.log.join('\n');
    
    // Show download link
    const downloadLink = document.getElementById('download-link');
    downloadLink.href = result.url;
    downloadContainer.style.display = 'block';
    
  } catch (error) {
    errorDisplay.textContent = `Error: ${error.message}`;
    errorDisplay.style.display = 'block';
    stateOutput.textContent = 'Parse failed';
    evolutionLog.textContent = error.stack || error.message;
  }
}

function clearCanvas() {
  const canvas = document.getElementById('physics-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  document.getElementById('state-output').textContent = 'Awaiting input...';
  document.getElementById('evolution-log').textContent = 'No simulation run yet.';
  document.getElementById('download-container').style.display = 'none';
}
